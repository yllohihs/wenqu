// ============ 高光日集齐撒星星 ============
function spawnStarShower(){
  let wrap = document.getElementById('starShower');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'starShower';
    wrap.className = 'star-shower';
    document.body.appendChild(wrap);
  }
  // SVG 花瓣/花朵/叶子，低饱和，贴合米白纸感
  // 阴影直接画进 SVG（偏移的深色路径），不用 filter:drop-shadow —— 那个是动画性能杀手
  const GRAD = (id, c1, c2) => `<defs><linearGradient id="p${id}" x1="20%" y1="0%" x2="80%" y2="100%"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs>`;
  const SAKURA_PATH = 'M12 31.5 C4 24 2.5 12 8 2 C9.5 6.5 12 8.5 12 8.5 C12 8.5 14.5 6.5 16 2 C21.5 12 20 24 12 31.5 Z';
  // 整花用的单片：从中心向外辐射，顶端带缺口
  const FLOWER_PETAL = 'M16 16.5 C10 14 8.2 8 10.4 4.4 C12 1.7 14.4 1.1 16 3.3 C17.6 1.1 20 1.7 21.6 4.4 C23.8 8 22 14 16 16.5 Z';
  // 花蕊：七根细丝 + 顶端花药
  const STAMENS = `<g stroke="#D8A79C" stroke-width="0.75" stroke-linecap="round" opacity="0.8">`
    + `<path d="M16 16 L21.6 13.9"/><path d="M16 16 L18.2 9.9"/><path d="M16 16 L13.0 10.8"/>`
    + `<path d="M16 16 L9.6 14.9"/><path d="M16 16 L11.4 19.9"/><path d="M16 16 L16 22.5"/>`
    + `<path d="M16 16 L20.6 19.9"/></g>`
    + `<g fill="#E0B3A8">`
    + `<circle cx="21.6" cy="13.9" r="0.95"/><circle cx="18.2" cy="9.9" r="0.95"/><circle cx="13.0" cy="10.8" r="0.95"/>`
    + `<circle cx="9.6" cy="14.9" r="0.95"/><circle cx="11.4" cy="19.9" r="0.95"/><circle cx="16" cy="22.5" r="0.95"/>`
    + `<circle cx="20.6" cy="19.9" r="0.95"/></g>`
    + `<circle cx="16" cy="16" r="1.3" fill="#D8A79C" opacity="0.75"/>`;

  const SHAPES = [
    {
      // 单瓣樱花：主角，多数是它
      ratio:1.35, sizeMul:1, weight:5,
      tones:[ ['#FBE7E1','#EFC9C0'], ['#FDEFEA','#F3D3CB'], ['#F8E1DA','#EAC0B6'] ],
      svg:(id,c1,c2)=>`<svg viewBox="-2 -2 28 36">${GRAD(id,c1,c2)}`
        + `<path d="${SAKURA_PATH}" fill="#8A6258" opacity="0.13" transform="translate(1.1,1.5)"/>`
        + `<path d="${SAKURA_PATH}" fill="url(#p${id})"/></svg>`,
    },
    {
      // 整朵樱花：偶尔出现，五瓣 + 花蕊，个头稍大
      ratio:1, sizeMul:1.55, weight:1,
      tones:[ ['#FBE7E1','#EFC9C0'], ['#FDEFEA','#F3D3CB'], ['#F8E1DA','#EAC0B6'] ],
      svg:(id,c1,c2)=>`<svg viewBox="-2 -2 36 36">${GRAD(id,c1,c2)}`
        + `<circle cx="17.2" cy="17.6" r="13.6" fill="#8A6258" opacity="0.10"/>`
        + `<g fill="url(#p${id})">`
        + [0,72,144,216,288].map(a=>`<path d="${FLOWER_PETAL}" transform="rotate(${a} 16 16)"/>`).join('')
        + `</g>${STAMENS}</svg>`,
    },
    {
      // 叶子：点缀，柔和绿（呼应定位针的 #8FA57E），带一条叶脉
      ratio:1.4, sizeMul:1, weight:2,
      tones:[ ['#FBE7E1','#EFC9C0'], ['#FDEFEA','#F3D3CB'], ['#F8E1DA','#EAC0B6'] ],
      svg:(id,c1,c2)=>{
        const p = 'M12 0.5 C20 8 22 20 12 31.5 C2 20 4 8 12 0.5 Z';
        return `<svg viewBox="-2 -2 28 36">${GRAD(id,c1,c2)}`
          + `<path d="${p}" fill="#8A6258" opacity="0.13" transform="translate(1.1,1.5)"/>`
          + `<path d="${p}" fill="url(#p${id})"/>`
          + `<path d="M12 3 C12 12 12 22 12 29" stroke="#D3A99E" stroke-width="0.7" fill="none" opacity="0.28" stroke-linecap="round"/></svg>`;
      },
    },
  ];
  // 每种形状 × 自己的色调，按 weight 决定出现频率（单瓣 5 : 叶子 2 : 整花 1）
  const petals = [];
  SHAPES.forEach((sh, si)=>{
    sh.tones.forEach((tn, ti)=>{
      const item = { svg: sh.svg('s'+si+'t'+ti, tn[0], tn[1]), ratio: sh.ratio, sizeMul: sh.sizeMul };
      for(let w=0; w<sh.weight; w++) petals.push(item);
    });
  });
  let html = '';
  const N = 12;
  const spread = 6;
  for(let i=0;i<N;i++){
    const left = Math.random()*100;
    const delay = (i / N) * spread + (Math.random()*0.3 - 0.15);
    const dur = 5.5 + Math.random()*2.5;
    const p = petals[Math.floor(Math.random()*petals.length)];
    const size = (11 + Math.random()*7) * p.sizeMul;
    const sway = 8 + Math.random()*14;          // 左右飘动幅度
    const swayDur = 2 + Math.random()*1.6;
    const flipDur = 2.4 + Math.random()*2.6;
    html += `<span style="left:${left}%; width:${size}px; height:${(size*p.ratio).toFixed(1)}px; animation-duration:${dur}s; animation-delay:${Math.max(0,delay).toFixed(2)}s; --sway:${sway}px;">`
          + `<b style="animation-duration:${swayDur.toFixed(2)}s; animation-delay:${Math.max(0,delay).toFixed(2)}s;">`
          + `<i style="animation-duration:${flipDur.toFixed(2)}s;">${p.svg}</i></b></span>`;
  }
  wrap.style.opacity = 0.6;
  wrap.innerHTML = html;
  setTimeout(()=>{ if(wrap) wrap.innerHTML=''; }, 13000);
}

async function countAllMarks(){
  let count = 0;
  try{
    const keys = await sbListKeys('cal-month:');
    for(const key of keys){
      const ym = key.replace('cal-month:','');
      const v = monthCache[ym] || await sbGet(key);
      if(!v) continue;
      Object.keys(v).forEach(dk=>{
        if(v[dk] && v[dk].mark) count++;
      });
    }
  }catch(e){ console.error(e); }
  return count;
}

// ---- Realtime：对方写了什么，这边自动更新 ----
const RT_SELF_WINDOW = 6000;   // 自己刚写的变更在这个窗口内忽略，避免回声
let rtChannel = null;
const rtQueue = new Set();     // 正在编辑时先攒着，等安全了再应用

function currentView(){
  // 视图会被摘进 viewParking，所以按父节点判断，不能只看 display
  const el = Array.prototype.filter.call(document.querySelectorAll('.view'),
    v => v.parentNode !== viewParking && v.style.display !== 'none')[0];
  return el ? el.id.replace('view-','') : 'calendar';
}
// 正在写东西时不要重绘，否则输入框内容会被换掉
function isBusyEditing(){
  const modal = document.getElementById('dayModal');
  if(modal && modal.classList.contains('active')) return true;
  if(pendingPhotoUploading) return true;
  const a = document.activeElement;
  if(a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) return true;
  return false;
}
async function applyRemoteChange(key){
  if(!key) return;
  const view = currentView();
  if(key.indexOf('cal-month:') === 0){
    const ym = key.slice(10);
    delete monthCache[ym]; delete monthBase[ym];
    await loadMonth(ym);
    if(view === 'calendar') await renderCalendar(null, true);   // keepScroll，不打断阅读
    else if(view === 'album') renderAlbum();
    else if(view === 'philo') renderPhiloPage();
  } else if(key === 'wishlist'){
    await loadWishes();
    if(view === 'wishlist') renderWishlist();
  } else if(key === 'booklist'){
    await loadBooks();
    if(view === 'books') renderBooks();
  } else if(key === 'yours'){
    await loadYours();
    if(view === 'yours') renderYours();
  } else if(key === 'workouts'){
    await loadWorkouts();
    if(view === 'workout') renderWorkouts();
  } else if(key === 'places'){
    await loadPlaces();
    if(view === 'places') renderPlaces();
  } else if(key === 'cal-settings'){
    await loadSettings();
    updateMetCounter();
    if(view === 'calendar') await renderCalendar(null, true);
  }
}
async function flushRemoteQueue(){
  if(!rtQueue.size || isBusyEditing()) return;
  const keys = Array.from(rtQueue); rtQueue.clear();
  for(let i=0;i<keys.length;i++){
    try{ await applyRemoteChange(keys[i]); }catch(e){ console.error(e); }
  }
}
function onRemoteChange(payload){
  const row = (payload && (payload.new || payload.old)) || null;
  const key = row && row.key;
  if(!key) return;
  if(myWrites[key] && Date.now() - myWrites[key] < RT_SELF_WINDOW) return;   // 自己写的
  if(isBusyEditing()){ rtQueue.add(key); return; }
  applyRemoteChange(key).catch(e=>console.error(e));
}
function startRealtime(){
  if(!sb || typeof sb.channel !== 'function') return;
  try{
    if(rtChannel){ try{ sb.removeChannel(rtChannel); }catch(e){} rtChannel = null; }
    rtChannel = sb.channel('calendar-sync-'+Date.now())
      .on('postgres_changes', { event:'*', schema:'public', table:'calendar_data' }, onRemoteChange)
      .subscribe(function(status){ console.log('[realtime]', status); });
  }catch(e){ console.error('realtime', e); }
}

// 从后台切回前台时刷新：iOS 会长时间保留页面，不刷新容易拿旧数据覆盖对方
document.addEventListener('visibilitychange', async function(){
  if(document.hidden) return;
  startRealtime();                                          // 后台会掐断长连接，回来重连
  const modal = document.getElementById('dayModal');
  if(modal && modal.classList.contains('active')) return;   // 正在编辑就不打扰
  rtQueue.clear();
  Object.keys(monthCache).forEach(k=>{ delete monthCache[k]; delete monthBase[k]; });
  try{ await renderCalendar(null, true); }catch(e){ console.error(e); }
});
