<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Our Calendar</title>

<!-- PWA: add to home screen, fullscreen, custom icon -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Calendar">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBDCE6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&family=Quicksand:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --cream:#FBF6ED;
    --paper:#FFFDF8;
    --ink:#2E2A26;
    --muted:#8A8276;
    --rose:#D96C63;
    --love:#C15A8A;
    --line:#EDE6D8;
    --panel:#E6E4E0;
    --panel-border:#D8D5D0;
    --panel-text:#3A362F;
    --font-text:'Noto Serif SC', 'Noto Color Emoji', serif;
    --font-title:'ZCOOL XiaoWei', 'Noto Serif SC', serif;
    --font-num:'DM Mono', 'Noto Color Emoji', monospace;
    --font-en:'Quicksand', 'Noto Color Emoji', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  /* 状态栏底色 = 状态栏下沿处渐变的实际颜色，不是渐变起点，否则会有一条接缝 */
  /* default 模式下网页从状态栏下方开始，接缝处正是渐变 0%，直接取起点色 */
  html{ height:100%; background:#FBDCE6; }
  /* 禁掉 iOS 双击缩放；输入框字号必须 ≥16px，否则聚焦时页面会被放大 */
  html, body, button, a, label, select, .cell, .wk-cell, .menu-item{ touch-action:manipulation; }
  body{
    font-family:var(--font-text);
    background:linear-gradient(180deg, #FBDCE6 0%, #F6ECDD 42%, #DCEBC9 100%);
    background-attachment:fixed;
    color:var(--ink);
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    overflow:hidden;
    padding-top:0;
    padding-bottom:0;
  }
  header{ flex:none; padding:calc(env(safe-area-inset-top) + 18px) 56px 20px; text-align:center; position:relative; }
  @media (max-width:520px){ .brand{ font-size:24px; } }
  .view{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #view-calendar{ --row:72px; --hrow:60px; --wrow:55px; display:flex; flex-direction:column; overflow:hidden; }
  @media (min-width:480px){ #view-calendar{ --row:82px; } }
  #view-wishlist, #view-books, #view-yours{ padding-top:calc(env(safe-area-inset-top) + 24px); }
  #view-wishlist{ padding-bottom:calc(80px + env(safe-area-inset-bottom)); }
  #view-books{ padding-bottom:calc(80px + env(safe-area-inset-bottom)); }
  .books-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
  .books-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:12px; }
  .books-list{ display:flex; flex-direction:column; }
  .book-month{ padding:14px 0 10px; border-bottom:1px solid rgba(0,0,0,0.08); }
  .book-month:last-child{ border-bottom:none; }
  .book-month-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  .book-month-name{ font-family:var(--font-en); font-size:16px; font-weight:600; color:var(--rose); }
  .book-month-add{ background:none; border:none; font-family:var(--font-text); font-size:12px; color:var(--muted); cursor:pointer; padding:2px 4px; }
  .book-month-add:hover{ color:var(--rose); }
  .book-add-row{ display:flex; gap:8px; align-items:center; padding:6px 0 2px; }
  .book-add-row input{ flex:0 1 auto; width:auto; min-width:0; max-width:60%; font-size:16px; transform:scale(0.875); transform-origin:left center; border:none; border-radius:0; padding:5px 2px; background:transparent; }
  .book-add-row input:focus{ outline:none; }
  .book-add-genrestep{ justify-content:flex-start; gap:16px; }
  .book-add-btn{ flex:none; font-family:var(--font-text); font-size:12px; padding:0 4px; border:none; background:none; color:var(--muted); cursor:pointer; }
  .book-add-btn:hover{ color:var(--rose); }
  .book-item{ display:flex; align-items:flex-start; gap:8px; padding:8px 4px; position:relative; }
  .book-score{ font-family:var(--font-num); font-size:14px; color:var(--rose); flex:none; padding-top:1px; }
  .book-menu-dots{ line-height:1.4; }
  .book-main{ flex:1; min-width:0; line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .book-main-plain{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; white-space:normal; overflow:visible; text-overflow:clip; }
  .book-main-plain .book-title{ white-space:nowrap; }
  .book-main-plain .book-meta{ display:inline-flex; gap:8px; white-space:nowrap; padding-left:0.55em; }
  .book-main-plain .book-author, .book-main-plain .book-genre{ margin-left:0; }
  .book-menu-wrap{ position:relative; flex:none; margin-left:auto; }
  .book-menu-dots{ font-size:18px; color:var(--muted); background:none; border:none; cursor:pointer; padding:0 4px; line-height:1; }
  .book-menu-dots:hover{ color:var(--rose); }
  .book-menu-pop{ position:absolute; right:0; top:26px; background:var(--paper); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.16); padding:6px; z-index:30; display:flex; flex-direction:column; min-width:76px; }
  .book-menu-pop button{ font-family:var(--font-text); font-size:14px; color:var(--ink); background:none; border:none; text-align:left; padding:8px 12px; cursor:pointer; border-radius:8px; }
  .book-menu-pop button:hover{ background:var(--panel); }
  .book-menu-pop button.danger{ color:#C0605F; }
  .book-item.rating-mode{ align-items:flex-start; }
  .book-item.rating-mode .book-main{ flex:1; white-space:normal; overflow:visible; }
  .book-rate-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .book-main .book-rate-row .book-title{ flex:0 1 auto; }
  .book-rate-row .book-score{ margin-left:auto; }
  .book-sub-row{ margin-top:4px; padding-left:0.3em; }
  .book-scrim{ position:fixed; inset:0; z-index:25; background:transparent; }
  .book-item-active{ position:relative; z-index:28; }
  .book-actions{ display:inline-flex; align-items:center; gap:10px; flex:none; padding-top:2px; }
  .book-title{ font-family:var(--font-text); font-size:15px; color:var(--ink); line-height:1.4; }
  .book-author{ font-family:var(--font-text); font-size:15px; color:var(--ink); margin-left:8px; }
  .book-genre{ font-family:var(--font-text); font-size:15px; color:var(--muted); margin-left:8px; }
  .book-rate-inline{ font-family:var(--font-num); font-size:16px; color:var(--muted); margin-left:8px; white-space:nowrap; display:inline-flex; align-items:center; flex:none; }
  .book-rate-in{ width:2.5ch !important; min-width:0 !important; flex:none !important; font-size:16px; font-family:var(--font-num); border:none !important; border-radius:0 !important; padding:0 !important; margin:0 !important; background:transparent !important; text-align:right; color:var(--rose); -webkit-appearance:none; appearance:none; }
  .book-rate-in:focus{ outline:none; background:transparent !important; }
  .book-rate-stars{ display:inline-flex; gap:2px; align-items:center; flex:none; margin-left:4px; }
  .rate-star{ position:relative; width:26px; height:26px; cursor:pointer; display:flex; align-items:center; }
  .rate-star svg{ width:26px; height:26px; display:block; }
  .rate-star svg{ width:22px; height:22px; display:block; }
  .star-half-left, .star-half-right{ position:absolute; top:0; width:50%; height:100%; z-index:2; }
  .star-half-left{ left:0; }
  .star-half-right{ right:0; }
  .book-score-who{ color:var(--muted); font-size:11px; margin-right:4px; }
  .book-inline-btn{ font-family:var(--font-text); font-size:12px; color:var(--muted); background:none; border:none; cursor:pointer; padding:0; }
  .book-inline-btn:hover{ color:var(--rose); }
  .book-del-text{ font-family:var(--font-text); font-size:12px; color:var(--muted); background:none; border:none; cursor:pointer; padding:0; }
  .book-del-text:hover{ color:var(--rose); }
  .book-month-add.editing{ color:var(--rose); }
  .book-add-genre{ display:flex; gap:16px; padding:2px 0 4px; }
  .genre-pick{ font-family:var(--font-text); font-size:13px; color:var(--muted); background:none; border:none; padding:2px 0; cursor:pointer; }
  .genre-pick.on{ color:var(--rose); font-weight:600; }
  .book-add-genrestep{ align-items:center; gap:14px; }
  .book-add-hint{ font-family:var(--font-text); font-size:14px; color:var(--ink); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .book-item-edit{ align-items:flex-start; gap:8px; }
  .book-edit-fields{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .book-edit-row1{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .book-edit-in{ font-size:16px; border:none; border-radius:0; padding:3px 2px; background:transparent; field-sizing:content; }
  .book-edit-in:focus{ outline:none; }
  .book-edit-title{ width:auto; flex:0 1 auto; min-width:80px; max-width:150px; }
  .book-edit-author{ width:auto; flex:0 1 auto; min-width:60px; max-width:110px; }
  .book-edit-genre{ display:flex; gap:14px; }
  .book-stars{ flex:none; display:flex; gap:1px; cursor:pointer; }
  .book-star{ position:relative; width:16px; height:16px; }
  .book-star svg{ width:16px; height:16px; display:block; }
  .book-star .st-full{ fill:#E9B44C; }
  .book-star .st-empty{ fill:#E4DED2; }
  .book-del{ flex:none; background:none; border:none; color:#CFC8BC; font-size:14px; cursor:pointer; padding:2px 4px; }
  .book-del:hover{ color:var(--rose); }
  .books-empty{ font-family:var(--font-text); font-size:13px; color:var(--muted); text-align:center; padding:30px 0; }
  .rate-pop{ position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.15); }
  .rate-pop.open{ display:flex; }
  .rate-card{ background:var(--paper); border-radius:16px; padding:20px 22px; box-shadow:0 12px 40px rgba(0,0,0,0.18); }
  .rate-title{ font-family:var(--font-text); font-size:14px; color:var(--ink); text-align:center; margin-bottom:14px; max-width:220px; }
  .rate-stars{ display:flex; gap:4px; justify-content:center; }
  .rate-stars .book-star{ width:30px; height:30px; }
  .rate-stars .book-star svg{ width:30px; height:30px; }
  .rate-val{ font-family:var(--font-num); font-size:13px; color:var(--muted); text-align:center; margin-top:12px; }
  .rate-clear{ display:block; margin:12px auto 0; background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; }
  .wx-tip{ position:fixed; left:0; right:0; top:0; z-index:120; background:rgba(60,48,44,0.93); color:#fff; font-family:var(--font-text); font-size:13px; line-height:1.6; padding:11px 42px 11px 16px; text-align:center; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .wx-tip button{ position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:#fff; font-size:20px; line-height:1; padding:4px 10px; cursor:pointer; -webkit-tap-highlight-color:transparent; outline:none; opacity:0.8; }
  .bday-pop{ display:none; position:fixed; inset:0; z-index:95; align-items:center; justify-content:center; background:transparent; -webkit-backdrop-filter:blur(8px) saturate(0.95); backdrop-filter:blur(8px) saturate(0.95); padding:24px; }
  .bday-pop.open{ display:flex; }
  .bday-card{ position:relative; background:linear-gradient(160deg, #FFF3F6, #FDF0E4); border-radius:24px; padding:40px 30px 30px; max-width:360px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.28); overflow:hidden; animation:bdayIn 0.5s cubic-bezier(.22,1,.36,1); }
  @keyframes bdayIn{ 0%{ transform:scale(0.8) translateY(20px); opacity:0; } 100%{ transform:scale(1) translateY(0); opacity:1; } }
  .bday-cake{ font-size:56px; line-height:1; margin-bottom:18px; animation:bdayCake 2s ease-in-out infinite; }
  @keyframes bdayCake{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-6px) rotate(3deg); } }
  .bday-text{ font-family:var(--font-text); font-size:15px; line-height:1.9; color:var(--ink); white-space:pre-wrap; margin-bottom:26px; }
  .bday-close{ font-family:var(--font-text); font-size:14px; color:#fff; background:var(--rose); border:none; border-radius:20px; padding:11px 28px; cursor:pointer; box-shadow:0 4px 14px rgba(224,143,179,0.4); }
  .bday-close:active{ transform:scale(0.96); }
  .bday-confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .bday-confetti i{ position:absolute; top:-10px; width:8px; height:8px; border-radius:2px; opacity:0.9; animation:confettiFall linear infinite; }
  @keyframes confettiFall{ 0%{ transform:translateY(-10px) rotate(0); opacity:1; } 100%{ transform:translateY(460px) rotate(360deg); opacity:0.7; } }
  .star-shower{ position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden; contain:strict; }
  /* 三层分工，各管一件事，避免复合动画卡顿 */
  .star-shower span{ position:absolute; top:-30px; line-height:0; animation:petalFall linear forwards; will-change:transform, opacity; transform:translateZ(0); backface-visibility:hidden; }
  .star-shower span b{ display:block; width:100%; height:100%; perspective:180px; animation:petalSway ease-in-out infinite alternate; }
  .star-shower span i{ display:block; width:100%; height:100%; animation:petalFlip linear infinite; backface-visibility:visible; }
  .star-shower span svg{ display:block; width:100%; height:100%; }
  @keyframes petalFall{
    0%{ transform:translate3d(0, -30px, 0); opacity:0; }
    12%{ opacity:1; }
    88%{ opacity:1; }
    100%{ transform:translate3d(0, 108vh, 0); opacity:0; }
  }
  @keyframes petalSway{
    from{ transform:translate3d(calc(var(--sway) * -1), 0, 0); }
    to{ transform:translate3d(var(--sway), 0, 0); }
  }
  @keyframes petalFlip{
    from{ transform:rotate3d(1, 1, 0.15, 0deg); }
    to{ transform:rotate3d(1, 1, 0.15, 360deg); }
  }
  .cal-layout{ flex:1; min-height:0; display:flex; flex-direction:column; margin-top:8px; padding-bottom:calc(78px + env(safe-area-inset-bottom)); position:relative; }
  .wrap{ width:100%; max-width:640px; margin:0 auto; padding:0 16px; }
  #view-calendar.wrap{ width:100%; max-width:660px; }

  .brand{
    font-family:var(--font-en); font-weight:600; font-size:30px;
    color:var(--rose);
    display:inline-block;
  }
  .brand .flower-icon{ display:inline-block; height:0.98em; width:0.98em; vertical-align:-0.17em; }
  .brand .flower-icon svg{ height:100%; width:100%; display:block; }
  .brand .clover-icon{ height:0.92em; width:auto; vertical-align:-0.14em; }
  .brand .title-text{ margin:0 8px; }
  .brand-sub{ font-family:var(--font-num); font-size:12.5px; color:var(--muted); margin-top:6px; }
  .whoami-badge{
    position:absolute; right:16px; top:26px; display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--muted); cursor:pointer;
  }

  /* nav */
  .cal-header{ flex:none; display:flex; justify-content:space-around; align-items:center; padding:24px 0 12px; }
  .cal-year{ position:fixed; z-index:45; width:30px; height:30px; box-sizing:border-box;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:var(--font-num); font-size:19px; font-weight:700; line-height:0.85; letter-spacing:0;
    color:var(--rose); transform:scaleX(1.1) scaleY(0.75); }
  .cal-year.tr{ top:calc(env(safe-area-inset-top) + 22px); right:16px; }
  .cal-year.backto{ font-family:var(--font-en); font-size:10.5px; font-weight:700; line-height:1.15;
    letter-spacing:0.2px; transform:none; cursor:pointer; white-space:nowrap; z-index:47;
    transition:color 0.2s ease, transform 0.25s cubic-bezier(.22,1,.36,1); }
  .cal-year.backto b{ font-weight:700; }
  .cal-year.backto:active{ transform:scale(0.9); }
  body.backto-open .cal-year.backto{ transform:scale(0.88); color:var(--rose) !important; }

  .backto-scrim{ position:fixed; inset:0; z-index:45; display:none; }
  body.backto-open .backto-scrim{ display:block; }
  .backto-opt{
    position:fixed; left:16px; bottom:calc(env(safe-area-inset-bottom) + 20.5px);
    width:35px; height:35px; border-radius:50%; z-index:46;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-text); font-size:10px; font-weight:600; letter-spacing:0.1px; line-height:1.1; text-align:center;
    color:var(--rose); background:rgba(255,255,255,0.55); border:1px solid rgba(255,255,255,0.6);
    box-shadow:0 6px 18px -6px rgba(120,90,90,0.3);
    -webkit-backdrop-filter:blur(10px) saturate(1.3); backdrop-filter:blur(10px) saturate(1.3);
    cursor:pointer; padding:0;
    opacity:0; pointer-events:none; transform:translate(0,0) scale(0.3);
    transition:transform 0.34s cubic-bezier(.22,1,.36,1), opacity 0.22s ease;
  }
  body.backto-open .backto-opt{
    opacity:1; pointer-events:auto;
    transform:translate(var(--dx), var(--dy)) scale(1);
  }
  body.backto-open .backto-opt:active{ transform:translate(var(--dx), var(--dy)) scale(0.92); }
  .backto-opt:nth-of-type(1){ transition-delay:0s; }
  .backto-opt:nth-of-type(2){ transition-delay:0.04s; }
  .backto-opt:nth-of-type(3){ transition-delay:0.08s; }
  body.backto-open .bottom-counter{ opacity:0; }
  body.who-open .bottom-counter{ opacity:0; }
  .bottom-counter{ transition:opacity 0.25s ease; }

  .cal-year.bl{ left:18px; bottom:calc(env(safe-area-inset-bottom) + 23px); color:#8FA57E !important; }
  .backto-btn{ position:fixed; left:16px; bottom:calc(20.5px + env(safe-area-inset-bottom)); width:35px; height:35px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:47; box-sizing:border-box; transition:transform 0.25s cubic-bezier(.22,1,.36,1); -webkit-tap-highlight-color:transparent; outline:none; -webkit-touch-callout:none; user-select:none; }
  .backto-btn:active{ transform:scale(0.9); }
  body.backto-open .backto-btn{ transform:scale(0.88); }
  .pin-svg{ position:relative; z-index:2; }
  .backto-btn{ overflow:visible; }
  .pin-reflection{
    position:absolute; left:50%; bottom:6px; margin-left:-11px;
    width:22px; height:22px;
    transform-origin:50% 92%;
    transform:translate(3px, 2px) perspective(150px) rotateX(66deg) rotateZ(40deg);
    opacity:0.3; z-index:1;
    -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,0.9), transparent 92%);
    mask-image:linear-gradient(to top, rgba(0,0,0,0.9), transparent 92%);
    pointer-events:none;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
  }
  .cal-year b{ font-weight:700; display:block; }
  @media (min-width:900px){
    #view-calendar{ --row:75px; --hrow:60px; --wrow:55px; overflow:visible; }
  }
  .jump-link{ display:inline-flex; align-items:center; justify-content:center; justify-self:center;
    width:44px; height:44px; padding:0; border-radius:50%; background:transparent;
    font-family:var(--font-text); font-size:12.5px; color:var(--muted); cursor:pointer; letter-spacing:0.3px;
    white-space:nowrap; user-select:none;
    transition:color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, transform 0.25s cubic-bezier(.22,1,.36,1); }
  .jump-link:hover{ color:var(--ink); transform:translateY(-1px);
    background:linear-gradient(135deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.24) 100%);
    -webkit-backdrop-filter:blur(6px) saturate(1.08); backdrop-filter:blur(6px) saturate(1.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7), inset 0 0 0 1px rgba(255,255,255,0.28), 0 6px 14px -8px rgba(120,90,90,0.3); }
  .jump-link:active{ transform:translateY(0) scale(0.95); }
  .jump-link:hover{ color:var(--rose); }
  .cal-header{ display:none; }
  .cal-scroll-wrap{ position:relative; flex:1; min-height:0; display:flex; }
  .cal-fade{ position:absolute; left:0; right:0; height:50px; pointer-events:none; z-index:12;
    background-image:linear-gradient(180deg, #FBDCE6 0%, #F6ECDD 42%, #DCEBC9 100%);

  .wk-tag{ font-family:var(--font-en); font-size:8.5px; padding:2px 6px; border-radius:6px; letter-spacing:0.5px; }
  .wk-tag.hs{ background:rgba(217,108,99,0.15); color:#A8483F; }
  .wk-tag.mn{ background:rgba(143,165,126,0.22); color:#5E6E4E; }
  .wk-tag.both{ background:rgba(224,167,46,0.2); color:#8A6A2E; }

  .wk-t3{ font-family:var(--font-text); font-size:11.5px; color:#A79B88; margin-top:2px; }
  .wk-dt{ font-family:var(--font-num); font-size:10.5px; color:#BDB09A; flex:none; }
  .wk-ops{ display:inline-flex; gap:10px; margin-left:14px; }

    -webkit-tap-highlight-color:transparent; outline:none; }
  .wk-op:active{ color:var(--rose); }
  .wk-empty{ text-align:center; font-family:var(--font-text); font-size:12.5px; color:#A79B88; padding:26px 0; line-height:2; }
  /* 抽签筒（影青釉） */
  .yours-jar{ display:flex; flex-direction:column; align-items:center; margin:6px 0 26px; }
  .jar-svg{ cursor:pointer; -webkit-tap-highlight-color:transparent; outline:none; }
  .jar-tip{ font-family:var(--font-num); font-size:10px; color:#C4B8A4; letter-spacing:2.5px; margin-top:12px; transition:opacity 0.3s ease; }
  /* 记事本：横线纸，抽中后浮起出现，可直接书写 */
  .notepad{ display:none; position:relative; width:100%; max-width:330px; margin:18px auto 0;
    background:#FFFCF4; border-radius:4px 4px 6px 6px;
    box-shadow:0 1px 0 #F2EADB, 0 3px 0 -1px #FDF9F0, 0 4px 0 -1px #EFE7D8,
               0 14px 26px -12px rgba(140,110,105,0.35);
    padding:16px 20px 12px; text-align:left; }
  .notepad.show{ display:block; animation:npFloat 0.55s cubic-bezier(.2,1,.3,1) both; }
  @keyframes npFloat{
    0%{ opacity:0; transform:translateY(16px) rotate(-1.5deg) scale(0.96); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:translateY(0) rotate(0) scale(1); }
  }
  /* 装订孔 */
  .notepad::before{ content:''; position:absolute; top:7px; left:22px; right:22px; height:5px;
    background-image:radial-gradient(circle, rgba(0,0,0,0.13) 42%, transparent 46%);
    background-size:34px 5px; background-repeat:repeat-x; opacity:0.6; }
  .np-prompt{ font-family:var(--font-text); font-size:14.5px; line-height:30px; color:#9E8F7C;
    padding-top:8px; border-bottom:1px solid #E9E0CD; }
  /* 横线纸：行高 30px，线条对齐文字基线 */
  .np-write{ display:block; width:100%; min-height:120px; margin:0; padding:0; border:none; resize:none;
    font-family:var(--font-text); font-size:15px; line-height:30px; color:#4A4038; box-sizing:border-box;
    background-image:repeating-linear-gradient(#FFFCF4 0, #FFFCF4 29px, #E9E0CD 29px, #E9E0CD 30px);
    background-attachment:local; }
  .np-write:focus{ outline:none; }
  .np-write::placeholder{ color:#C9BEA8; }
  .np-bar{ display:flex; align-items:center; justify-content:space-between; padding-top:8px; }
  .np-again{ font-family:var(--font-en); font-size:17px; color:#C4B8A4; border:none; background:none;
    cursor:pointer; padding:4px 6px; line-height:1; transition:color 0.2s, transform 0.35s;
    -webkit-tap-highlight-color:transparent; outline:none; }
  .np-again:active{ color:var(--rose); transform:rotate(-180deg); }
  .np-save{ font-family:var(--font-text); font-size:12.5px; color:#9C9384; border:none; background:none;
    cursor:pointer; padding:4px 2px; -webkit-tap-highlight-color:transparent; outline:none; }
  .np-save:active{ color:var(--rose); }
  @keyframes jarShake{ 0%,100%{ transform:translateY(0) rotate(0); } 30%{ transform:translateY(-3px) rotate(-1.5deg); }
    60%{ transform:translateY(1px) rotate(1deg); } }
  .jar-shaking{ animation:jarShake 0.55s ease-in-out; }
  @keyframes slipRise{ from{ transform:translateY(12px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .yours-prompts{ display:flex; flex-direction:column; gap:8px; margin:8px 0 26px; }
  .yours-prompt{ font-family:var(--font-text); font-size:14px; color:var(--rose); background:rgba(224,143,179,0.08); border:1px solid rgba(224,143,179,0.2); border-radius:20px; padding:10px 16px; cursor:pointer; transition:background 0.2s ease; }
  .yours-prompt:active{ background:rgba(224,143,179,0.18); }
  .yours-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
  .yours-card{ background:rgba(255,255,255,0.5); border:1px solid rgba(0,0,0,0.05); border-radius:14px; padding:14px 16px; }
  .yours-text{ font-family:var(--font-text); font-size:15px; line-height:1.7; color:var(--ink); white-space:pre-wrap; cursor:text; }
  .yours-edit{ width:100%; font-family:var(--font-text); font-size:16px; line-height:1.7; border:none; background:transparent; resize:vertical; min-height:60px; }
  .yours-edit:focus{ outline:none; }
  .yours-meta{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-family:var(--font-num); font-size:11px; color:var(--muted); }
  .yours-del{ background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; padding:0; }

  .yours-add{ display:flex; flex-direction:column; gap:8px; }
  .yours-add textarea{ width:100%; font-family:var(--font-text); font-size:16px; line-height:1.9; border:none; border-bottom:1px solid rgba(0,0,0,0.1); border-radius:0; padding:10px 2px; background:transparent; resize:none; min-height:64px; box-sizing:border-box; color:var(--ink); }
  .yours-add textarea:focus{ outline:none; border-bottom-color:rgba(217,108,99,0.5); }
  .yours-add textarea::placeholder{ color:#BDB09A; }
  .yours-add button{ align-self:flex-end; }
  .album-loading, .album-empty{ font-family:var(--font-text); font-size:13px; color:var(--muted); text-align:center; padding:40px 0; }
  .album-month{ margin-bottom:22px; }
  .album-month-head{ font-family:var(--font-en); font-size:15px; font-weight:600; color:var(--rose); margin-bottom:10px; }
  .album-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  @supports not (aspect-ratio:1){ .album-cell::before{ content:''; display:block; padding-top:100%; } }
  .album-cell{ position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; cursor:pointer; background:#eee; }
  .album-cell img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform 0.3s ease; }
  .album-cell:active img{ transform:scale(0.95); }
  .album-cell-day{ position:absolute; left:6px; bottom:5px; font-family:var(--font-num); font-size:11px; font-weight:600; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.6); }

  .philo-card:active{ transform:scale(0.98); }

  /* iOS 在 default 模式下取网页顶端颜色画状态栏，并会缓存。
     遮罩盖住顶端会让它采样到压暗的颜色，之后一直发灰 —— 留一条原色顶边给它采样 */

  /* wishlist */
  .wish-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:6px; }
  .wish-colorbar{ display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .wish-colorbar-label{ font-family:var(--font-text); font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:0.6px; }
  .wish-title{ font-family:var(--font-en); font-size:22px; font-weight:600; }
  /* 相册/哲学是日历的附页，标题沿用思源宋体，不参与独立页的编号体系 */
  #view-album .wish-title, #view-philo .wish-title{ font-family:var(--font-text); font-weight:600; font-size:25px; color:#5C4A42; letter-spacing:1px; }
  /* 独立页标题：等宽小序号 + 疏朗细宋 */
  .ptitle{ display:flex; align-items:baseline; justify-content:center; margin-bottom:20px; }
  /* 右上角一枚小印，替代序号 */
  .ptitle .dot{ position:absolute; right:-13px; top:3px; width:6px; height:6px; border-radius:50%; background:var(--rose); opacity:0.75; }
  .ptitle .zh{ font-family:var(--font-title); font-weight:400; font-size:26px; color:#5C4A42; letter-spacing:3px; position:relative; display:inline-block; }
  .ptitle .zh::after{ content:''; position:absolute; left:-3px; right:-3px; bottom:1px; height:6px; background:rgba(239,201,192,0.6); border-radius:3px; z-index:-1; }
  #view-wishlist .ptitle .zh{ color:#A85449; letter-spacing:1px; }
  .books-head-center{ justify-content:center; }
  .page-title-black{ text-align:center; margin-bottom:20px; }
  .wish-subbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .wish-subbar .wish-progress{ font-family:var(--font-num); font-size:13px; color:var(--muted); }
  .wish-colorwrap{ display:flex; align-items:center; gap:10px; }
  .wish-color-toggle{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-en); font-size:13px; color:var(--muted); background:none; border:none; cursor:pointer; padding:0; order:2; flex:none; }
  .wish-color-cur{ width:13px; height:13px; border-radius:50%; background:var(--muted); display:inline-block; }
  .wish-colorwrap .color-picker{ order:1; display:flex; flex-direction:row-reverse; gap:6px; }
  .wish-colorwrap .color-picker .color-dot{ width:13px; height:13px; }
  .wish-progress{ font-family:var(--font-num); font-size:12px; color:var(--muted); }
  .wish-list{ display:flex; flex-direction:column; }
  .wish-item{ display:flex; align-items:flex-start; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); position:relative; }
  .wish-check{ flex:0 0 auto; width:20px; height:20px; border-radius:50%; border:1.5px solid #CFC8BC; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; margin-top:2px; transition:all 0.15s; }
  .wish-item.done .wish-check{ background:var(--green,#8FA57E); border-color:var(--green,#8FA57E); }
  .wish-num{ font-family:var(--font-num); font-size:11px; color:#BDB6A9; flex:0 0 auto; margin-top:4px; min-width:20px; text-align:right; }
  .wish-body{ flex:1; min-width:0; }
  .wish-row{ display:block; }
  .wish-textwrap{ min-width:0; }
  .wish-text{ font-family:var(--font-text); font-size:14px; line-height:1.55; color:var(--ink); cursor:text; }
  .wish-item.done .wish-text .wt-body,
  .wish-item.done .wish-comment-inline{ color:var(--muted); text-decoration:line-through; }
  .wish-item.done .wish-comment-inline .c-who{ text-decoration:line-through; }
  .wish-byline{ font-family:var(--font-num); font-size:10px; color:#BDB6A9; margin-top:5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .wish-byline .pin-flag{ color:var(--rose); }
  .wish-byline-inline{ font-family:var(--font-num); font-size:10px; color:#BDB6A9; white-space:nowrap; text-decoration:none; }
  .wish-byline-inline .bl-dot{ margin:0 4px; opacity:0.6; }
  .wish-byline-inline .pin-flag{ color:var(--rose); }
  .wish-item.done .wish-byline-inline{ text-decoration:none; }
  .wish-actions{ display:flex; gap:12px; margin-top:6px; }
  .wish-actions button{ background:none; border:none; padding:0; font-family:var(--font-text); font-size:11px; color:#BDB6A9; cursor:pointer; }
  .wish-actions button:hover{ color:var(--rose); }
  .wish-item.pinned{ background:linear-gradient(90deg, rgba(217,108,99,0.06), transparent 60%); }
  .wish-edit-row{ display:flex; gap:8px; align-items:center; }
  .wish-edit{ flex:1; min-width:0; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:5px 2px; font-family:var(--font-text); font-size:16px; background:transparent; color:var(--ink); transform:scale(0.875); transform-origin:left center; }
  .wish-edit:focus{ outline:none; border-bottom-color:var(--rose); }

  .wish-comment{ font-family:var(--font-text); font-size:14px; position:relative; padding-right:16px; line-height:1.5; }
  .wish-comment .c-who{ font-family:var(--font-num); font-size:11px; opacity:0.7; margin-right:6px; }
  .wish-comment .c-del{ position:absolute; top:0; right:0; background:none; border:none; color:currentColor; font-size:11px; cursor:pointer; opacity:0.5; }

  .wish-comment-add.open{ display:flex; }
  .wish-comment-add input{ flex:1; min-width:0; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:5px 2px; font-family:var(--font-text); font-size:16px; background:transparent; color:#2B5C8A; transform:scale(0.875); transform-origin:left center; }

</head>

  {key:'proud', label:'超想夸你', emoji:'🌟', color:'#E0C22E'},
  {key:'fight', label:'小吵一下', emoji:'😤', color:'#D9704A'},
  {key:'cold', label:'冷战中', emoji:'🥶', color:'#5FA0C9'},
  {key:'wait', label:'等你回复', emoji:'⏳', color:'#C9A02E'},

const WHO_OPTIONS = ['HS', 'MN'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DEFAULT_MET = '2026-01-15';
const DEFAULT_LOVE = '2026-04-30';

let settings = { met:DEFAULT_MET, loveStart:DEFAULT_LOVE, customPersonal:[], customInteractive:[], hiddenPersonal:[], hiddenInteractive:[] };  // shared
let myName = null;                              // personal
let monthCache = {};   // 'YYYY-MM' -> { 'DD': { statuses:[{author,key,type}], moments:[{id,photo,note,author}], rants:[...], philo:[...] } }
let curYear, curMonth;
let openDayKey = null;
let pendingPhotoData = null;
let pendingPhotoUploading = false;

function pad(n){ return String(n).padStart(2,'0'); }
function ymOf(y,m){ return `${y}-${pad(m+1)}`; }
function ymdOf(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }

function nameColor(name){
  if(!name) return '#B0A99A';
  let sum = 0;
  for(let i=0;i<name.length;i++) sum += name.charCodeAt(i);
  return AVATAR_COLORS[sum % AVATAR_COLORS.length];
}
function accentColor(str){
  let sum = 0;
  for(let i=0;i<str.length;i++) sum += str.charCodeAt(i);
  return ACCENT_PALETTE[sum % ACCENT_PALETTE.length];
}
function avatarHtml(name){
  const initial = (name || '?').slice(0,1).toUpperCase();
  return `<span class="avatar" style="background:${nameColor(name)}">${initial}</span>`;
}
function personalAllPresets(){ return [...STATUS_PRESETS, ...(settings.customPersonal||[])]; }
function interactiveAllPresets(){ return [...INTERACTIVE_PRESETS, ...(settings.customInteractive||[])]; }

// ---------- Supabase storage layer ----------
// Fill these in from your Supabase project (Settings -> API)
const SUPABASE_URL = 'https://iaslfdjhgdgjtzkseqqv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_veLAyBOulxmEmPy9yjHRaA_WooW0JC7';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function reportError(where, error){
  const msg = (error && (error.message || error.error_description || error.hint || error.details)) || JSON.stringify(error);
  console.error('['+where+']', msg, error);
  let banner = document.getElementById('errBanner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'errBanner';
    banner.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#B23B3B;color:#fff;font-family:sans-serif;font-size:12.5px;padding:10px 14px;z-index:999;line-height:1.5;';
    document.body.appendChild(banner);
  }
  banner.textContent = '连接数据库出错(' + where + '): ' + msg;
}

async function sbGet(key){
  const { data, error } = await sb.from('calendar_data').select('value').eq('key', key).maybeSingle();
  if(error){ reportError('读取 '+key, error); return null; }
  return data ? data.value : null;
}
const myWrites = {};   // key -> 本地最后写入时间，用于过滤 Realtime 回声
async function sbSet(key, value){
  myWrites[key] = Date.now();
  const { error } = await sb.from('calendar_data').upsert({ key, value, updated_at: new Date().toISOString() });
  if(error){ reportError('保存 '+key, error); return false; }
  myWrites[key] = Date.now();
  return true;
}
async function sbListKeys(prefix){
  const { data, error } = await sb.from('calendar_data').select('key').like('key', prefix+'%');
  if(error){ reportError('列出 '+prefix, error); return []; }
  return data.map(r=>r.key);
}

async function loadSettings(){
  try{
    const v = await sbGet('cal-settings');
    if(v) settings = { met:DEFAULT_MET, loveStart:DEFAULT_LOVE, customPersonal:[], customInteractive:[], hiddenPersonal:[], hiddenInteractive:[], ...v };
  }catch(e){ /* not set */ }
}
let myCommentColor = null;
function loadMyName(){
  // identity is a local device preference, not shared data
  myName = localStorage.getItem('whoami') || null;
  myCommentColor = localStorage.getItem('commentColor') || null;
}
async function persistSettings(){
  const ok = await sbSet('cal-settings', settings);
  if(!ok) console.error('保存失败');
  return ok;
}

// ---- 多人协作：三方合并（base=上次同步快照 / local=本地 / remote=服务器最新）----
// 数据按整月存一个 JSON，两人同时写会互相覆盖。保存前先拉远程做合并，避免静默丢数据。
const monthBase = {};   // 每个月上次与服务器一致时的快照

function cloneData(o){ try{ return JSON.parse(JSON.stringify(o||{})); }catch(e){ return {}; } }

// 条目唯一键：moments/rants/philo 有 id；statuses 用 author|key|type
function itemKey(item, i){
  if(item && item.id != null) return 'id:'+item.id;
  if(item && item.key != null) return 'st:'+(item.author||'')+'|'+item.key+'|'+(item.type||'');
  return 'ix:'+i;
}
function merge3List(base, local, remote){
  base = base||[]; local = local||[]; remote = remote||[];
  const baseMap = new Map(), localMap = new Map();
  base.forEach((x,i)=>baseMap.set(itemKey(x,i), x));
  local.forEach((x,i)=>localMap.set(itemKey(x,i), x));
  const out = [], seen = new Set();
  remote.forEach((r,i)=>{
    const k = itemKey(r,i);
    if(seen.has(k)) return;
    seen.add(k);
    if(baseMap.has(k) && !localMap.has(k)) return;              // 本地删掉的，不要复活
    if(localMap.has(k)){
      const l = localMap.get(k), b = baseMap.get(k);
      const edited = JSON.stringify(l) !== JSON.stringify(b);
      out.push(edited ? l : r);                                  // 本地改过用本地，否则用远程
    } else {
      out.push(r);                                               // 远程新增
    }
  });
  local.forEach((l,i)=>{
    const k = itemKey(l,i);
    if(seen.has(k)) return;
    seen.add(k);
    out.push(l);                                                 // 本地新增
  });
  return out;
}
const DAY_LISTS = ['statuses','moments','rants','philo'];
function mergeDay(base, local, remote){
  base = base||{}; local = local||{}; remote = remote||{};
  const out = {};
  DAY_LISTS.forEach(f=>{ out[f] = merge3List(base[f], local[f], remote[f]); });
  // mark 是标量：本地改过用本地，否则跟远程
  out.mark = (local.mark !== base.mark) ? local.mark
           : (('mark' in remote) ? remote.mark : local.mark);
  if(out.mark == null) delete out.mark;
  [remote, local].forEach(src=>{
    Object.keys(src).forEach(k=>{
      if(k === 'mark' || DAY_LISTS.indexOf(k) !== -1) return;
      if(!(k in out)) out[k] = src[k];
    });
  });
  return out;
}
function mergeMonth(base, local, remote){
  base = base||{}; local = local||{}; remote = remote||{};
  const keys = new Set([].concat(Object.keys(base), Object.keys(local), Object.keys(remote)));
  const out = {};
  keys.forEach(dk=>{
    if((dk in base) && !(dk in local)) return;   // 本地整天删掉了
    out[dk] = mergeDay(base[dk], local[dk], remote[dk]);
  });
  return out;
}

async function loadMonth(ym, force){
  if(monthCache[ym] && !force) return monthCache[ym];
  let data = {};
  try{
    const v = await sbGet('cal-month:'+ym);
    if(v) data = v;
  }catch(e){ /* empty month, fine */ }
  Object.values(data).forEach(day=>{
    day.statuses = (day.statuses||[]).map(s=>({ type:'personal', ...s }));
    day.moments = (day.moments||[]).map(m=>({ author:'?', ...m }));
    day.rants = day.rants||[];
    day.philo = day.philo||[];
  });
  monthCache[ym] = data;
  monthBase[ym] = cloneData(data);   // 记下与服务器一致的基准
  return data;
}
async function saveMonth(ym){
  let remote = null;
  try{ remote = await sbGet('cal-month:'+ym); }catch(e){ /* 远程读不到就直接写本地 */ }
  const local = monthCache[ym] || {};
  const merged = remote ? mergeMonth(monthBase[ym], local, remote) : local;
  // 原地更新，保持 monthCache[ym] 的对象引用不变
  if(monthCache[ym] && merged !== local){
    Object.keys(monthCache[ym]).forEach(k=>{ delete monthCache[ym][k]; });
    Object.assign(monthCache[ym], merged);
  } else {
    monthCache[ym] = merged;
  }
  const ok = await sbSet('cal-month:'+ym, monthCache[ym]);
  if(ok){
    monthBase[ym] = cloneData(monthCache[ym]);
  } else {
    console.error('保存失败');
    alert('保存失败了，检查一下网络再试一次');
  }
  return ok;
}

function daysSince(dateStr){
  const start = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.floor((now-start)/86400000) + 1;
}
function updateMetCounter(){

  if(settings.loveStart) parts.push(`恋爱第 ${daysSince(settings.loveStart)} 天`);
  el.textContent = parts.length ? parts.join('  ·  ') : '还没设置日期';
}

function ensureIdentity(){
  if(!myName){
    openSettings(true);
    return false;
  }
  return true;
}

}

function monthColor(month){
  // month 0..11 -> gradient pink -> warm -> green (deeper/saturated so text is readable)
  const stops = [ [0, [216,90,140]], [0.5, [201,140,63]], [1, [111,150,80]] ];
  const t = month / 11;
  let a = stops[0], b = stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(t >= stops[i][0] && t <= stops[i+1][0]){ a = stops[i]; b = stops[i+1]; break; }
  }
  const span = (b[0]-a[0]) || 1;
  const k = (t - a[0]) / span;
  const c = a[1].map((v,i)=> Math.round(v + (b[1][i]-v)*k));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function buildMonthHtml(year, month, todayStr){
  const ym = ymOf(year, month);
  const monthData = monthCache[ym] || {};
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const interPresets = interactiveAllPresets();

  let cells = '';
  let gridIdx = 0;
  for(let i=0;i<firstDay;i++){ cells += `<div class="cell empty" data-idx="${gridIdx}"></div>`; gridIdx++; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = ymdOf(year, month, d);
    const isToday = dateStr === todayStr;
    const isMet = settings.met === dateStr;
    const isLove = settings.loveStart === dateStr;
    const mmdd = `${pad(month+1)}-${pad(d)}`;
    const isBirthday = mmdd === '08-16' || mmdd === '11-15';
    let cls = 'cell';
    if(isToday) cls += ' today';
    if(isMet) cls += ' met';
    if(isLove) cls += ' love';
    if(isBirthday) cls += ' birthday';
    let numContent = String(d);
    if(isMet) numContent = 'Hi';
    if(isLove) numContent = '♥';
    if(isBirthday) numContent = '🎂';

    const dd = monthData[pad(d)] || {};
    const mark = dd.mark;   // 'star' | 'moon' | undefined

    if(isMet || isLove || isBirthday){
      // 特殊日期优先：Hi/♥/🎂 不会被星月盖掉
      cells += `<div class="${cls}" data-idx="${gridIdx}" onclick="openDay('${dateStr}')"><div class="num">${numContent}</div></div>`;
      gridIdx++;
      continue;
    }

    if(mark){
      // 高光/重要日：星月取代数字本身，其它内容不显示
      const sym = mark==='star' ? '⭐' : '🌙';
      cells += `<div class="cell mark-cell" data-idx="${gridIdx}" onclick="openDay('${dateStr}')"><div class="num mark-num">${sym}</div></div>`;
      gridIdx++;
      continue;
    }

    const interactive = (dd.statuses || []).filter(s=>s.type==='interactive');
    const allEmojis = [];
    interactive.forEach(s=>{
      const info = interPresets.find(p=>p.key===s.key);
      if(info) allEmojis.push(info.emoji);
    });
    let interEmojis = '';
    if(allEmojis.length){
      let display;
      if(allEmojis.length <= 3){
        // 3个以内：全显示，重复也显示
        display = allEmojis;
      }else{
        // 超过3个：先去重
        display = [...new Set(allEmojis)];
      }
      const shown = display.slice(0,3);
      interEmojis = shown.map(e=>`<span>${e}</span>`).join('');
      if(display.length > 3) interEmojis += `<span class="more-dot"><i></i><i></i><i></i></span>`;
    }
    const hasMoments = dd.moments && dd.moments.length;
    const hasNote = (dd.rants && dd.rants.length) || (dd.philo && dd.philo.length);
    const diaryLabel = hasMoments ? 'Diary' : (hasNote ? 'Note' : '');
    let indicators = '';
    if(interEmojis) indicators += `<div class="cell-inter">${interEmojis}</div>`;
    if(diaryLabel) indicators += `<div class="cell-diary">${diaryLabel}</div>`;

    cells += `<div class="${cls}" data-idx="${gridIdx}" onclick="openDay('${dateStr}')"><div class="num">${numContent}</div>${indicators}</div>`;
    gridIdx++;
  }
  return `
    <div class="cal-month" id="month-${ym}">
      <div class="cal-month-title" style="color:${monthColor(month)}">${MONTH_NAMES[month]}</div>
      <div class="weekday-row"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="cal-grid">${cells}</div>
    </div>`;
}

async function renderCalendar(scrollTo, keepScroll){
  const now = new Date();
  const todayStr = ymdOf(now.getFullYear(), now.getMonth(), now.getDate());
  const scroller0 = document.getElementById('calScroll');
  const prevScroll = scroller0 ? scroller0.scrollTop : 0;
  // 固定起点：2026年1月；终点：当前月 + 6 个月（随时间自动延伸）
  const start = new Date(2026, 0, 1);
  const end = new Date(now.getFullYear(), now.getMonth()+6, 1);
  let total = (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth()) + 1;
  if(total < 18) total = 18; // 至少 18 个月，保证初期也够看
  // preload all month data
  const toLoad = [];
  for(let i=0;i<total;i++){
    const dt = new Date(start); dt.setMonth(dt.getMonth()+i);
    toLoad.push(ymOf(dt.getFullYear(), dt.getMonth()));
  }
  await Promise.all(toLoad.map(ym=>loadMonth(ym)));

  let html = '';
  for(let i=0;i<total;i++){
    const dt = new Date(start); dt.setMonth(dt.getMonth()+i);
    // 第一个月上方：旅程起点引导语
    if(i===0){
      html += `<div class="journey-start">Our Journey Starts Here...</div>`;
    }
    // 跨年分隔：每年1月之前插一个年份标记（第一个月除外）
    if(dt.getMonth()===0 && i>0){
      html += `<div class="cal-yeardiv">${dt.getFullYear()}</div>`;
    }
    html += buildMonthHtml(dt.getFullYear(), dt.getMonth(), todayStr);
  }
  const scroller = document.getElementById('calScroll');
  scroller.innerHTML = html;
  scroller.onscroll = updateJumpYear;

  if(keepScroll){
    scroller.scrollTop = prevScroll;
    updateJumpYear();
    return;
  }
  // scroll to a target month
  const targetYm = scrollTo || ymOf(curYear, curMonth);
  const targetEl = document.getElementById('month-'+targetYm);
  if(targetEl){ targetEl.scrollIntoView({ block:'center' }); }
  updateJumpYear();
}

function updateJumpYear(){
  const scroller = document.getElementById('calScroll');
  const el = document.getElementById('menuYear');
  if(!scroller || !el) return;
  const months = scroller.querySelectorAll('.cal-month');
  const top = scroller.getBoundingClientRect().top;
  const anyMonth = [...months].reverse().find(m=>{
    const r = m.getBoundingClientRect();
    return r.top - top <= 40;
  });
  if(anyMonth){ el.textContent = anyMonth.id.split('-')[1]; }
}

function jumpToMonth(year, month){
  curYear = year; curMonth = month;
  renderCalendar(ymOf(year, month));

}

  ['moments','rants','philo'].forEach(t=>{
    const btn = document.getElementById('editBtn-'+t);
    if(btn){ btn.textContent = '✎'; btn.classList.remove('editing'); }
  });
  openDayKey = dateStr;
  const [y,m,d] = dateStr.split('-');
  const ym = `${y}-${m}`;
  const dkey = d;
  await loadMonth(ym, true);   // 强制重读，拿对方刚写的内容
  if(!monthCache[ym][dkey]) monthCache[ym][dkey] = { statuses:[], moments:[], rants:[], philo:[] };

  document.getElementById('dm-modal').style.background = MODAL_PALETTE[Math.floor(Math.random()*MODAL_PALETTE.length)];

  let sub = '';
  if(settings.loveStart){
    const love = new Date(settings.loveStart+'T00:00:00');

    if(dateStr === settings.loveStart) sub = '♥ 恋爱纪念日';
    else if(diff>1) sub = `恋爱第 ${diff} 天`;
  }
  document.getElementById('dm-sub').textContent = sub;

  document.getElementById('dm-asWho').innerHTML = '';

  pendingPhotoData = null;
  document.getElementById('dm-photoFile').value = '';

  renderDayContent();
  document.getElementById('dayModal').classList.add('active');

async function toggleMark(which){
  const dd = currentDayObj();
  if(!dd) return;
  dd.mark = (dd.mark === which) ? null : which;   // 再点同一个=取消；点另一个=互斥切换
  refreshMarkButtons();
  // 两个按钮都先清掉动画残留
  ['dm-markStar','dm-markMoon'].forEach(id=>{
    const b = document.getElementById(id);
    b.classList.remove('pop');
  });
  // 仅在"点亮"时播放回弹动画
  if(dd.mark === which){
    const btn = document.getElementById(which==='star' ? 'dm-markStar' : 'dm-markMoon');
    void btn.offsetWidth;
    btn.classList.add('pop');
    btn.addEventListener('animationend', ()=>btn.classList.remove('pop'), { once:true });
  }
  const [y,m] = openDayKey.split('-');
  await saveMonth(`${y}-${m}`);
  // 点亮（非取消）时，检查高光日是否集齐 10 的倍数 → 关弹窗，星星撒在日历主页
  if(dd.mark === which){

    if(total > 0 && total % 10 === 0){
      closeDay();                       // 先关弹窗，露出干净的日历页
      setTimeout(spawnStarShower, 380); // 等关闭动画结束再撒
    }
  }
}

function presetsFor(type, who){

  const base = (type==='personal' ? STATUS_PRESETS : INTERACTIVE_PRESETS);
  const hidden = (type==='personal' ? (settings.hiddenPersonal||[]) : (settings.hiddenInteractive||[]));
  return [...base, ...custom].filter(s=>!hidden.includes(s.key));
}

// 把 base64 dataURL 上传到 Supabase Storage，返回公开链接
async function uploadPhotoToStorage(dataUrl){
  // dataURL -> Blob
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  const filename = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const { error } = await sb.storage.from('photos').upload(filename, blob, {
    contentType: 'image/jpeg', upsert: false
  });
  if(error) throw error;
  const { data } = sb.storage.from('photos').getPublicUrl(filename);
  return data.publicUrl;
}

function handlePhotoFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = async function(){
      const maxDim = 1000;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else{ w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      // 上传到图床，存链接
      pendingPhotoData = dataUrl;  // 先显示预览（本地 base64）
      pendingPhotoUploading = true;
      renderPhotoPreview();
      try{
        const url = await uploadPhotoToStorage(dataUrl);
        pendingPhotoData = url;   // 换成图床链接
      }catch(err){
        console.error('照片上传失败', err);
        alert('照片上传失败，请检查网络后重试');
        pendingPhotoData = null;
      }
      pendingPhotoUploading = false;
      renderPhotoPreview();
    };
    img.onerror = function(){ alert('这张图片读取失败,换一张试试'); };
    img.src = ev.target.result;
  };
  reader.onerror = function(){ alert('读取文件失败'); };
  reader.readAsDataURL(file);
}
function renderPhotoPreview(){
  const el = document.getElementById('dm-photoPreview');
  if(!pendingPhotoData){ el.innerHTML=''; return; }
  const uploading = pendingPhotoUploading ? '<div class="photo-uploading">上传中…</div>' : '';
  el.innerHTML = `<div class="photo-preview"><img src="${pendingPhotoData}">${uploading}<button type="button" onclick="clearPhotoFile()">✕</button></div>`;
}

// ---------- Backup / restore ----------
// 一次性迁移：把所有月份 moments 里的 base64 照片搬到图床，换成链接
async function migratePhotos(){
  if(!confirm('把所有旧照片搬到图床？\n这会让数据变小、恢复正常保存。照片不会丢，建议在网络好时进行。')) return;
  try{
    const keys = await sbListKeys('cal-month:');
    let total = 0, done = 0, failed = 0;
    // 先统计需要迁移的数量
    const monthsData = {};
    for(const key of keys){
      const v = await sbGet(key);
      if(!v) continue;
      monthsData[key] = v;
      for(const dk in v){
        const day = v[dk];
        if(day && Array.isArray(day.moments)){
          day.moments.forEach(mm=>{ if(mm.photo && mm.photo.startsWith('data:')) total++; });
        }
      }
    }
    if(total===0){ alert('没有需要迁移的旧照片，已经都是链接了'); return; }
    if(!confirm(`共发现 ${total} 张旧照片，开始迁移？`)) return;

    for(const key in monthsData){
      const v = monthsData[key];
      let changed = false;
      for(const dk in v){
        const day = v[dk];
        if(!day || !Array.isArray(day.moments)) continue;
        for(const mm of day.moments){
          if(mm.photo && mm.photo.startsWith('data:')){
            try{
              const url = await uploadPhotoToStorage(mm.photo);
              mm.photo = url;
              changed = true;
              done++;
            }catch(e){
              console.error('迁移失败', e);
              failed++;
            }
          }
        }
      }
      if(changed){
        // 保存这个月（现在照片已是链接，数据变小）
        await sbSet(key, v);
        if(monthCache[key.replace('cal-month:','')]) monthCache[key.replace('cal-month:','')] = v;
      }
    }
    alert(`迁移完成：成功 ${done} 张${failed?`，失败 ${failed} 张（可再点一次重试）`:''}`);
    // 刷新当前视图
    monthCache = {};
    await renderCalendar();
  }catch(e){
    console.error(e);
    alert('迁移出错：'+(e.message||e));
  }
}

async function exportBackup(){
  try{
    const keys = await sbListKeys('cal-month:');
    const months = {};
    for(const key of keys){
      const v = await sbGet(key);
      if(v) months[key] = v;
    }
    const backup = {
      exportedAt: new Date().toISOString(),
      settings: settings,
      months: months,
      wishlist: wishes,
      booklist: books,
      yours: yoursItems,
      workouts: workouts,
      places: places
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateTag = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `our-calendar-backup-${dateTag}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    console.error(e);
    alert('导出失败,再试一次');
  }
}

async function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup || !backup.months){ alert('这不是一个有效的备份文件'); return; }
    if(!confirm('导入会用备份文件里的内容覆盖当前日历的同名数据,确定要继续吗?')) return;

    if(backup.settings){
      settings = { customPersonal:[], customInteractive:[], ...backup.settings };
      await persistSettings();
    }
    for(const [key, value] of Object.entries(backup.months)){
      await sbSet(key, value);
    }
    if(Array.isArray(backup.wishlist)){
      wishes = backup.wishlist;
      await saveWishes();
    }
    if(Array.isArray(backup.booklist)){
      books = backup.booklist;
      await saveBooks();
    }
    if(Array.isArray(backup.yours)){
      yoursItems = backup.yours;
      await saveYours();
    }
    if(Array.isArray(backup.workouts)){
      workouts = backup.workouts;
      await saveWorkouts();
    }
    if(Array.isArray(backup.places)){
      places = backup.places;
      await savePlaces();
    }
    monthCache = {};
    updateMetCounter();
    await renderCalendar();
    alert('导入完成');
  }catch(e){
    console.error(e);
    alert('导入失败,文件可能损坏了');
  }finally{
    evt.target.value = '';
  }
}

function starSvg(kind){
  const star = 'M12 3.2l2.6 5.3 5.8 0.85-4.2 4.1 1 5.75-5.2-2.72-5.2 2.72 1-5.75-4.2-4.1 5.8-0.85z';

function renderRateStars(id, score){
  // score 是 0-10（半星=1），渲染 5 颗可点星，每颗分左右半区
  let html = '';
  for(let i=0;i<5;i++){
    const filled = score - i*2;
    let kind = 'empty';
    if(filled>=2) kind='full';
    else if(filled>=1) kind='half';
    // 每颗星左半区=半星(i*2+1)，右半区=整星(i*2+2)
    html += `<span class="book-star rate-star">
      ${starSvg(kind)}
      <span class="star-half-left" onclick="rateBookStar(${id}, ${i*2+1})"></span>
      <span class="star-half-right" onclick="rateBookStar(${id}, ${i*2+2})"></span>
    </span>`;
  }

}

async function addPlace(){
  if(!ensureIdentity()) return;
  if(plPhotoUploading){ alert('照片还在上传，稍等一下'); return; }
  const name = document.getElementById('plName').value.trim();
  if(!name){ alert('填一下店名'); return; }
  const num = v => { const n = parseFloat(v); return (isNaN(n) || v.trim()==='') ? null : Math.min(10, Math.max(0, n)); };
  const rec = {
    id: plEditId || Date.now(),
    name,
    address: document.getElementById('plAddr').value.trim(),
    cuisine: document.getElementById('plCuisine').value.trim(),
    date: document.getElementById('plDate').value,
    photo: plPhoto,
    score: { HS: num(document.getElementById('plScoreHS').value),
             MN: num(document.getElementById('plScoreMN').value) },
    note: document.getElementById('plNote').value.trim(),
  };
  if(plEditId){
    const i = places.findIndex(x=>x.id===plEditId);
    if(i>-1) places[i] = rec; else places.push(rec);
  } else places.push(rec);
  closePlForm();
  await savePlaces();
  renderPlaces();
}
async function deletePlace(id){
  const t = places.find(p=>p.id===id);
  if(!t) return;
  if(!confirm('删掉「'+t.name+'」？')) return;
  places = places.filter(p=>p.id!==id);
  await savePlaces();
  renderPlaces();
}
function setPlSort(k){ plSortBy = k; renderPlaces(); }

function renderPlaces(){
  const sorts = [['date','DATE'],['score','SCORE'],['location','LOCATION'],['cuisine','CUISINE']];
  document.getElementById('plSort').innerHTML = sorts.map(x =>
    `<div class="${plSortBy===x[0]?'on':''}" onclick="setPlSort('${x[0]}')">${x[1]}</div>`).join('');

  const avg = p => {
    const a = p.score && p.score.HS, b = p.score && p.score.MN;
    return (a!=null && b!=null) ? (a+b)/2 : null;
  };
  const byDate = (x,y) => x.date===y.date ? y.id-x.id : (x.date<y.date?1:-1);
  const list = places.slice().sort((x,y)=>{
    if(plSortBy === 'score'){
      const ax = avg(x), ay = avg(y);
      if(ax==null && ay==null) return byDate(x,y);
      if(ax==null) return 1;          // 没评完的排后面
      if(ay==null) return -1;
      return ay - ax;
    }
    if(plSortBy === 'location'){       // 同一条街的排在一起，没填地址的沉底
      const a = (x.address||'').trim(), b = (y.address||'').trim();
      if(!a && !b) return byDate(x,y);
      if(!a) return 1;
      if(!b) return -1;
      return a.localeCompare(b, 'zh', {numeric:true}) || byDate(x,y);   // 门牌号按数字大小
    }
    if(plSortBy === 'cuisine'){        // 同菜系排在一起
      const a = (x.cuisine||'').trim(), b = (y.cuisine||'').trim();
      if(!a && !b) return byDate(x,y);
      if(!a) return 1;
      if(!b) return -1;
      return a.localeCompare(b, 'zh') || byDate(x,y);
    }
    return byDate(x,y);
  });

  const el = document.getElementById('plList');
  if(!list.length){ el.innerHTML = '<div class="pl-empty">还没有记录</div>'; return; }
  el.innerHTML = list.map(p=>{
    const a = p.score && p.score.HS, b = p.score && p.score.MN;
    let scoreHtml;
    if(a!=null && b!=null){
      const m = (a+b)/2;
      scoreHtml = `<span class="pl-avg">${(Math.round(m*10)/10).toFixed(1)}</span>` +
                  `<span class="pl-each">HS ${a} · MN ${b}</span>`;
    } else if(a!=null || b!=null){
      // 只有一人打分：连自己的分也不显示，免得影响对方
      scoreHtml = `<span class="pl-wait">等 ${a!=null?'MN':'HS'} 打分</span>`;
    } else {
      scoreHtml = `<span class="pl-wait">还没评分</span>`;
    }
    const thumb = p.photo
      ? `<img class="pl-thumb" src="${escapeAttr(p.photo)}" loading="lazy">`
      : `<div class="pl-thumb none">🍜</div>`;
    const addr = p.address
      ? `<a class="pl-addr" href="https://maps.apple.com/?q=${encodeURIComponent(p.address+' '+p.name)}" target="_blank" rel="noopener">📍 ${escapeHtml(p.address)}</a>`
      : '';
    return `<div class="pl-item">
      ${thumb}
      <div class="pl-mid">
        <div class="pl-name">${escapeHtml(p.name)}${p.cuisine?`<span class="pl-cui">${escapeHtml(p.cuisine)}</span>`:''}
          <span class="pl-ops">
            <button class="pl-op" onclick="openPlForm(${p.id})">编辑</button>
            <button class="pl-op" onclick="deletePlace(${p.id})">删除</button>
          </span>
        </div>
        ${addr}
        <div class="pl-row">${scoreHtml}</div>
        ${p.note?`<div class="pl-note">${escapeHtml(p.note)}</div>`:''}
      </div>
      <span class="pl-date">${p.date ? p.date.slice(5).replace('-','/') : ''}</span>
    </div>`;
  }).join('');
}

let wkMonth = new Date().getMonth();

// 编辑时把已有数据填回表单
function fillWkForm(w){
  if(w.type === 'run'){
    if(w.dist) document.getElementById('wkDist').value = w.dist;
    if(w.dur){
      const m = Math.floor(w.dur), sec = Math.round((w.dur-m)*60);

      document.getElementById('wkSet'+i).value = x.sets || '';
      document.getElementById('wkRep'+i).value = x.reps || '';

    if(w.custom) document.getElementById('wkCustom').value = w.custom;
    if(w.dur){
      const m = Math.floor(w.dur), sec = Math.round((w.dur-m)*60);
      document.getElementById('wkDur').value = m || '';
      if(sec) document.getElementById('wkSec').value = sec;

       <div class="wk-f"><label>时长</label>
         <input id="wkDur" inputmode="numeric" placeholder="—">
         <span class="u">分</span>
         <input class="sec" id="wkSec" inputmode="numeric" placeholder="—">
         <span class="u">秒</span></div>`;
  }
}
function addExRow(){ const keep = collectEx(); wkExRows++; renderWkFields(); restoreEx(keep); }
function collectEx(){
  const out=[];
  for(let i=0;i<wkExRows;i++){
    const n=document.getElementById('wkEx'+i);
    if(!n) break;
    out.push({ name:n.value, kg:document.getElementById('wkKg'+i).value,
               sets:document.getElementById('wkSet'+i).value, reps:document.getElementById('wkRep'+i).value });
  }
  return out;
}
function restoreEx(list){
  list.slice(0,wkExRows).forEach((x,i)=>{
    const n=document.getElementById('wkEx'+i);
    if(!n) return;
    n.value=x.name; document.getElementById('wkKg'+i).value=x.kg;
    document.getElementById('wkSet'+i).value=x.sets; document.getElementById('wkRep'+i).value=x.reps;
  });
}
function wkDurMin(){
  const m = parseFloat(document.getElementById('wkDur').value) || 0;
  const sEl = document.getElementById('wkSec');
  const sec = sEl ? (parseFloat(sEl.value) || 0) : 0;
  return m + sec/60;
}
function updatePace(){
  const d = parseFloat(document.getElementById('wkDist').value);
  const t = wkDurMin();
  const el = document.getElementById('wkPace');
  if(d>0 && t>0){
    const p = t/d, m = Math.floor(p), sec = Math.round((p-m)*60);
    el.textContent = `${m}'${String(sec).padStart(2,'0')}" / km`;
  } else el.textContent = '';
}

async function addWorkout(){
  if(!ensureIdentity()) return;
  const date = document.getElementById('wkDate').value;
  if(!date){ alert('选一下日期'); return; }
  const who = wkWho;
  const note = document.getElementById('wkNote').value.trim();
  const rec = { id: wkEditId || Date.now(), date, who, type: wkType, note };
  if(wkType === 'run'){
    rec.dist = parseFloat(document.getElementById('wkDist').value) || 0;
    rec.dur  = wkDurMin();
    if(!rec.dist && !rec.dur){ alert('填一下距离或时长'); return; }
  } else if(wkType === 'strength'){
    rec.exercises = collectEx().filter(x=>x.name.trim());
    if(!rec.exercises.length){ alert('至少填一个动作'); return; }
  } else {
    rec.custom = document.getElementById('wkCustom').value.trim();
    rec.dur = wkDurMin();
    if(!rec.custom){ alert('填一下项目名'); return; }
  }
  if(wkEditId){
    const i = workouts.findIndex(x=>x.id===wkEditId);
    if(i>-1){ rec.id = wkEditId; workouts[i] = rec; }
    else workouts.push(rec);
  } else {
    workouts.push(rec);
  }
  closeWkForm();
  const dd = new Date(date + 'T12:00:00');       // 跳到这条记录所在的月份
  wkYear = dd.getFullYear(); wkMonth = dd.getMonth(); wkSelected = null;
  await saveWorkouts();
  renderWorkouts();
}
async function deleteWorkout(id){
  const t = workouts.find(w=>w.id===id);
  if(!t) return;
  if(!confirm('删掉这条记录？')) return;
  workouts = workouts.filter(w=>w.id!==id);
  await saveWorkouts();
  renderWorkouts();
}

function wkStreak(list){
  // 连续天数：任一人运动就算
  const days = new Set((list||workouts).map(w=>w.date));
  if(!days.size) return 0;
  let n = 0;
  const d = new Date();
  const key = x => x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
  if(!days.has(key(d))) d.setDate(d.getDate()-1);
  while(days.has(key(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
// 一天里出现了谁 → 圆环颜色
function wkDayWho(recs){
  if(recs.some(r=>r.who==='both')) return 'both';
  const hs = recs.some(r=>r.who==='HS'), mn = recs.some(r=>r.who==='MN');
  if(hs && mn) return 'both';
  return hs ? 'hs' : 'mn';
}
function wkMonthShift(n){
  const d = new Date(wkYear, wkMonth + n, 1);
  wkYear = d.getFullYear(); wkMonth = d.getMonth();
  wkSelected = null;
  renderWorkouts();
}
function pickWkDay(dateStr){
  wkSelected = (wkSelected === dateStr) ? null : dateStr;
  renderWorkouts();
}
function fmtDur(min){
  const m = Math.floor(min), sec = Math.round((min-m)*60);
  return sec ? `${m}'${String(sec).padStart(2,'0')}"` : m + ' 分';
}
function wkLine(w){
  if(w.type==='run'){
    const bits=[];
    if(w.dist) bits.push(w.dist+' km');
    if(w.dur)  bits.push(fmtDur(w.dur));
    if(w.dist>0 && w.dur>0){
      const p=w.dur/w.dist, m=Math.floor(p), sec=Math.round((p-m)*60);
      bits.push(`${m}'${String(sec).padStart(2,'0')}"/km`);
    }
    return bits.join(' · ');
  }
  if(w.type==='strength'){
    return (w.exercises||[]).map(x=>{
      let v = escapeHtml(x.name);
      if(x.kg) v += ' ' + x.kg + 'kg';
      if(x.sets && x.reps) v += ` ×${x.sets}×${x.reps}`;
      else if(x.sets) v += ` ×${x.sets}`;
      return v;
    }).join('　/　');
  }
  return w.dur ? fmtDur(w.dur) : '';
}
function renderWorkouts(){
  const ym = wkYear + '-' + pad(wkMonth+1);
  const mon = workouts.filter(w => (w.date||'').slice(0,7) === ym);

  // 顶部月份与小结
  document.getElementById('wkMonTitle').textContent =
    ['January','February','March','April','May','June','July',
     'August','September','October','November','December'][wkMonth] + ' ' + wkYear;
  const km = mon.reduce((a,w)=>a+(w.dist||0),0);
  document.getElementById('wkMonSum').textContent =
    mon.length ? `${mon.length} 次 · ${km.toFixed(1)} km` : '还没有记录';
  document.getElementById('wkMbar').classList.toggle('open', wkCalOpen);
  document.getElementById('wkCal').classList.toggle('open', wkCalOpen);

  // 日历格
  const first = new Date(wkYear, wkMonth, 1).getDay();
  const days  = new Date(wkYear, wkMonth+1, 0).getDate();
  const today = new Date();
  const todayStr = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  const byDay = {};
  mon.forEach(w=>{ (byDay[w.date] = byDay[w.date] || []).push(w); });

  let g = '';
  for(let i=0;i<first;i++) g += '<div class="wk-cell pad"></div>';
  for(let d=1; d<=days; d++){
    const ds = ym + '-' + pad(d);
    const recs = byDay[ds];
    let cls = 'wk-cell';
    if(recs){ cls += ' has ' + wkDayWho(recs); }
    if(ds === todayStr) cls += ' today';
    if(ds === wkSelected) cls += ' sel';
    g += `<div class="${cls}" onclick="pickWkDay('${ds}')"><span class="ring"></span>${d}</div>`;
  }
  document.getElementById('wkGrid').innerHTML = g;

  // 统计
  const cnt = who => mon.filter(w=>w.who===who).length;
  document.getElementById('wkStats').innerHTML =
    `<div class="wk-stat"><b>${cnt('HS')}</b><span>HS</span></div>` +
    `<div class="wk-stat"><b>${cnt('MN')}</b><span>MN</span></div>` +
    `<div class="wk-stat"><b>${cnt('both')}</b><span>together</span></div>` +
    `<div class="wk-stat"><b>${wkStreak()}</b><span>streak</span></div>`;

  // 列表：选中某天则只看那天，否则看本月
  const list = (wkSelected ? (byDay[wkSelected] || []) : mon)
    .slice().sort((a,b)=> a.date===b.date ? b.id-a.id : (a.date<b.date?1:-1));
  document.getElementById('wkDayTitle').textContent =
    wkSelected ? wkSelected.slice(5).replace('-','/') : 'THIS MONTH';
  const el = document.getElementById('wkList');
  if(!list.length){
    el.innerHTML = wkSelected ? '<div class="wk-empty">这天没有记录</div>' : '';
    return;
  }
  el.innerHTML = list.map(w=>{
    const t = WK_TYPES.find(x=>x.key===w.type) || WK_TYPES[2];
    const name = w.type==='other' ? (w.custom||'运动') : t.label;
    const whoCls = w.who==='both' ? 'both' : (w.who==='HS' ? 'hs' : 'mn');
    const whoTxt = w.who==='both' ? '一起' : w.who;
    const body = wkLine(w);
    return `<div class="wk-item">
      <span class="wk-ic">${t.icon}</span>
      <div class="wk-mid">
        <div class="wk-t1">${escapeHtml(name)}<span class="wk-tag ${whoCls}">${whoTxt}</span><span class="wk-ops"><button class="wk-op" onclick="openWkForm(${w.id})">编辑</button><button class="wk-op" onclick="deleteWorkout(${w.id})">删除</button></span></div>
        ${body?`<div class="wk-t2">${body}</div>`:''}
        ${w.note?`<div class="wk-t3">${escapeHtml(w.note)}</div>`:''}
      </div>
      <span class="wk-dt">${w.date.slice(5).replace('-','/')}</span>
    </div>`;
  }).join('');
}

let lotPool = [];        // 剩余没抽到的，抽空了重新装满，避免连续抽到同一句
let lotCurrent = '';
function drawLot(){
  const jar = document.getElementById('jarBody');
  const sticks = document.getElementById('jarSticks');
  const pad = document.getElementById('jarSlip');
  const prompt = document.getElementById('npPrompt');
  const tip = document.getElementById('jarTip');
  if(!jar || !pad) return;
  if(!lotPool.length) lotPool = YOURS_PROMPTS.slice();
  const idx = Math.floor(Math.random() * lotPool.length);
  lotCurrent = lotPool.splice(idx, 1)[0];

  jar.classList.remove('jar-shaking');
  void jar.offsetWidth;                       // 强制重排，动画才能重播
  jar.classList.add('jar-shaking');
  pad.classList.remove('show');
  if(sticks){
    sticks.style.transition = 'transform .4s ease-out, opacity .4s ease-out';
    setTimeout(()=>{ sticks.style.transform = 'translate(26px,-16px) rotate(8deg)'; sticks.style.opacity = '0'; }, 200);
    setTimeout(()=>{ sticks.style.transition = 'none'; sticks.style.transform = ''; sticks.style.opacity = ''; }, 760);
  }
  setTimeout(()=>{
    prompt.textContent = lotCurrent;
    void pad.offsetWidth;
    pad.classList.add('show');
    if(tip) tip.style.opacity = '0';
  }, 420);
}

async function renderAlbum(){
  const body = document.getElementById('albumBody');
  body.innerHTML = '<div class="album-loading">加载中…</div>';
  try{
    const keys = await sbListKeys('cal-month:');
    keys.sort();
    let totalCount = 0;
    let html = '';
    for(const key of keys){
      const ym = key.replace('cal-month:','');
      const v = await sbGet(key);
      if(!v) continue;
      const photos = [];
      Object.keys(v).sort().forEach(dk=>{
        const day = v[dk];
        if(day && Array.isArray(day.moments)){
          day.moments.forEach(mm=>{ if(mm.photo){ photos.push({ day: dk, photo: mm.photo }); } });
        }
      });
      if(!photos.length) continue;
      totalCount += photos.length;
      const [y,m] = ym.split('-');
      const monthName = MONTH_NAMES[Number(m)-1];
      html += `<div class="album-month"><div class="album-month-head">${monthName} ${y}</div><div class="album-grid">`;
      photos.forEach(p=>{
        const dateStr = `${ym}-${p.day}`;
        html += `<div class="album-cell" onclick="albumJump('${dateStr}')"><img src="${escapeAttr(p.photo)}" loading="lazy" onerror="this.parentElement.style.display='none'"><span class="album-cell-day">${Number(p.day)}</span></div>`;
      });
      html += `</div></div>`;
    }
    document.getElementById('albumCount').textContent = totalCount ? `${totalCount} 张照片` : '';
    body.innerHTML = html || '<div class="album-empty">还没有照片，去日历里记录带照片的一天吧</div>';
  }catch(e){
    console.error(e);
    body.innerHTML = '<div class="album-empty">加载失败，检查网络后重试</div>';
  }
}

async function renderPhiloPage(){
  const body = document.getElementById('philoBody');
  body.innerHTML = '<div class="album-loading">加载中…</div>';
  try{
    const keys = await sbListKeys('cal-month:');
    keys.sort();
    let total = 0, html = '';
    for(const key of keys){
      const ym = key.replace('cal-month:','');
      const v = await sbGet(key);
      if(!v) continue;
      const [y,m] = ym.split('-');
      const monthName = MONTH_NAMES[Number(m)-1];
      let monthHtml = '';
      // 按天聚合
      Object.keys(v).sort().forEach(dk=>{
        const day = v[dk];
        if(!day || !Array.isArray(day.philo) || !day.philo.length) return;
        const sorted = [...day.philo].sort((a,b)=>(a.time||0)-(b.time||0));
        total += sorted.length;
        const dateStr = `${ym}-${dk}`;
        const lines = sorted.map(p=>
          `<div class="philo-line"><span class="philo-who">${escapeHtml(p.author||'')}</span><span class="philo-said">${escapeHtml(p.text)}</span></div>`
        ).join('');
        monthHtml += `<div class="philo-card" onclick="albumJump('${dateStr}')">
          <div class="philo-card-date">${monthName.slice(0,3)} ${Number(dk)}</div>
          ${lines}
        </div>`;
      });
      if(monthHtml){
        html += `<div class="philo-month"><div class="album-month-head">${monthName} ${y}</div>${monthHtml}</div>`;
      }
    }
    document.getElementById('philoCount').textContent = total ? `${total} 条记录` : '';
    body.innerHTML = html || '<div class="album-empty">还没有哲学记录，去日历里记一个吧</div>';
  }catch(e){
    console.error(e);
    body.innerHTML = '<div class="album-empty">加载失败，检查网络后重试</div>';
  }
}

  score = Math.max(0, Math.min(10, score));

  const b = books.find(x=>x.id===id);
  if(b){ b.score = score; await saveBooks(); }

function drawRateStars(score){
  const wrap = document.getElementById('rateStars');
  let html = '';
  for(let i=0;i<5;i++){
    const filled = score - i*2;
    let kind = 'empty';
    if(filled>=2) kind='full';
    else if(filled>=1) kind='half';
    // 每颗星左右两个可点区
    html += `<span class="book-star" style="position:relative">
      ${starSvg(kind)}
      <span onclick="setRate(${i*2+1})" style="position:absolute;left:0;top:0;width:50%;height:100%"></span>
      <span onclick="setRate(${i*2+2})" style="position:absolute;right:0;top:0;width:50%;height:100%"></span>
    </span>`;
  }
  wrap.style.opacity = 0.6;
  wrap.innerHTML = html;
  document.getElementById('rateVal').textContent = `${(score/2).toFixed(1)} / 5`;
}

function sortedWishes(){
  // done items sink to the bottom; within not-done, pinned first; keep original order otherwise
  return wishes.map((w,i)=>({w, i})).sort((a,b)=>{
    if(!!a.w.done !== !!b.w.done) return (!!a.w.done) - (!!b.w.done); // done last
    if(!a.w.done && (!!a.w.pinned !== !!b.w.pinned)) return (!!b.w.pinned) - (!!a.w.pinned); // pinned first among not-done
    return a.i - b.i;
  }).map(x=>x.w);
}

function renderWishlist(){
  const doneCount = wishes.filter(w=>w.done).length;
  document.getElementById('wishProgress').textContent = `${doneCount} / 100`;
  const el = document.getElementById('wishList');
  const list = sortedWishes();
  el.innerHTML = list.map((w)=>{
    const num = wishes.indexOf(w)+1;
    const byline = [];
    if(w.pinned) byline.push(`<span class="pin-flag">📌 置顶</span>`);
    if(w.addedBy) byline.push(`${w.addedBy} 添加`);
    if(w.done && w.doneAt) byline.push(`✓ ${w.doneBy||''} ${w.doneAt}`);

    const comments = (w.comments||[]).map(c=>`<span class="wish-comment-inline" style="color:${c.color||'#2B5C8A'}"><span class="c-who">${escapeHtml(c.who||'')}</span>${escapeHtml(c.text)}${c.who===myName ? `<button class="c-del" onclick="event.stopPropagation();deleteComment(${w.id},${c.id})">✕</button>` : ''}</span>`).join('');

    const bylineHtml = byline.length ? `<span class="wish-byline-inline">${byline.join('<span class="bl-dot">·</span>')}</span>` : '';

    const textPart = editingWishId===w.id
      ? `<div class="wish-edit-row">
           <input class="wish-edit" id="wishEdit-${w.id}" value="${escapeAttr(w.text)}"
             onkeydown="if(event.key==='Enter')saveEdit(${w.id})">
           <button class="wish-edit-done" onmousedown="event.preventDefault()" onclick="saveEdit(${w.id})">Send</button>
         </div>`
      : `<div class="wish-text" onclick="startEdit(${w.id})"><span class="wt-body">${escapeHtml(w.text)}</span>${comments ? ' '+comments : ''}${bylineHtml ? ' '+bylineHtml : ''}</div>`;

    return `
    <div class="wish-item ${w.done?'done':''} ${w.pinned?'pinned':''}">
      <div class="wish-check" onclick="toggleWish(${w.id})">${w.done?'✓':''}</div>
      <div class="wish-num">${num}</div>
      <div class="wish-body">
        <div class="wish-textwrap">${textPart}</div>
        <div class="wish-comment-add ${commentOpenId===w.id?'open':''}" id="commentBox-${w.id}">
          <input type="text" id="wishComment-${w.id}" placeholder="留个言..." onkeydown="if(event.key==='Enter')addComment(${w.id})">
          <button onclick="addComment(${w.id})">Send</button>
        </div>
        <div class="wish-actions">
          <button onclick="toggleCommentBox(${w.id})">留言</button>
          <button onclick="startEdit(${w.id})">编辑</button>
          <button onclick="togglePin(${w.id})">${w.pinned?'取消置顶':'置顶'}</button>
          <button onclick="deleteWish(${w.id})">删除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// 隐藏入口：连点菜单里的版本号 5 次 → 重放生日弹窗（不写标记）
let bdayTapCount = 0, bdayTapTimer = null;
function bdayVerTap(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }   // 阻止 iOS 双击缩放
  bdayTapCount++;
  clearTimeout(bdayTapTimer);
  bdayTapTimer = setTimeout(function(){ bdayTapCount = 0; resetVerHint(); }, 1500);
  const el = document.getElementById('menuVer');
  if(el && bdayTapCount >= 2){ el.style.opacity = String(0.8 - bdayTapCount*0.12); }  // 越点越淡，知道有反应
  if(bdayTapCount >= 5){
    bdayTapCount = 0;
    resetVerHint();
    const drawer = document.getElementById('menuDrawer');
    if(drawer && drawer.classList.contains('open')) toggleMenu();
    setTimeout(function(){ openBdayPop(new Date().getFullYear()); }, 260);
  }
}
function resetVerHint(){
  const el = document.getElementById('menuVer');
  if(el) el.style.opacity = '';
}
// touchend 直接响应，避开 click 的 300ms 延迟；桌面端回退到 click
(function bindVerTap(){
  const el = document.getElementById('menuVer');
  if(!el) return;
  let touched = false;
  el.addEventListener('touchend', function(e){ touched = true; bdayVerTap(e); }, { passive:false });
  el.addEventListener('click', function(e){
    if(touched){ touched = false; return; }   // 触屏已处理，不重复计数
    bdayVerTap(e);
  });
})();
