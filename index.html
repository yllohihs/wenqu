<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>问渠 · Wellspring</title>
<meta name="theme-color" content="#FCFCFB" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#131311" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#FCFCFB; --card:#FFFFFF; --raise:#F6F6F4; --ink:#161513; --ink-soft:#6B6862; --ink-faint:#A3A099;
    --line:rgba(22,21,19,.12); --line-soft:rgba(22,21,19,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131311; --card:#1B1B18; --raise:#201F1B; --ink:#F0EEE7; --ink-soft:#9B9890; --ink-faint:#6A6860;
      --line:rgba(240,238,231,.14); --line-soft:rgba(240,238,231,.07);
    }
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:'Noto Sans SC','Inter',system-ui,sans-serif; background:var(--paper); color:var(--ink); line-height:1.6; overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;}
  .en{font-family:'Inter',sans-serif;}
  .wrap{max-width:600px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}
  ::-webkit-scrollbar{display:none;}

  header{padding:calc(env(safe-area-inset-top) + 30px) 28px 18px; display:flex; align-items:center; justify-content:space-between;}
  .brand .brow{display:flex; align-items:flex-end; gap:12px;}
  .brand h1{font-size:24px; font-weight:400; letter-spacing:10px; color:var(--ink); padding-left:10px; margin:0;}
  .brand .ben{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--ink-faint); padding-bottom:5px;}
  .gear{background:none; border:none; color:var(--ink-faint); font-size:19px; cursor:pointer; padding:6px; line-height:1;}
  .gear:hover{color:var(--ink);}

  /* 列表头 + filter */
  .list-head{display:flex; align-items:center; justify-content:space-between; padding:6px 28px 0;}
  .list-head .lbl{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--ink-faint);}
  .sortbtn{background:none; border:none; font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-faint); cursor:pointer; display:flex; align-items:center; gap:6px; padding:0;}
  .sortbtn b{color:var(--ink); font-weight:500;}
  .sortbtn:hover{color:var(--ink-soft);}

  main{flex:1; padding:0 0 130px; position:relative;}
  .installbar{display:none; align-items:center; gap:10px; margin:14px 28px 0; padding:12px 16px; border:0.5px solid var(--line); font-size:12px; color:var(--ink-soft); letter-spacing:.3px;}
  .installbar.show{display:flex;}
  .installbar button{margin-left:auto; font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; padding:7px 14px; border:none; background:var(--ink); color:var(--paper); cursor:pointer;}

  /* 线索列表 */
  .thread{padding:19px 28px; border-top:0.5px solid var(--line-soft); cursor:pointer; transition:background .15s; display:flex; gap:18px; animation:fade .4s ease both;}
  .thread:first-of-type{border-top:0.5px solid var(--line);}
  .thread:hover{background:var(--raise);}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  .thread .num{font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-faint); letter-spacing:1px; padding-top:3px; min-width:22px;}
  .thread .col{flex:1; min-width:0;}
  .thread .ttitle{font-size:16px; font-weight:400; line-height:1.6; color:var(--ink); letter-spacing:.2px;}
  .thread .tmeta{display:flex; align-items:center; gap:10px; margin-top:12px;}
  .thread .tconcepts{font-size:11px; letter-spacing:.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .thread .tstage{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-faint); margin-left:auto; white-space:nowrap;}

  .empty{text-align:center; padding:80px 32px; color:var(--ink-faint);}
  .empty .big{font-size:17px; color:var(--ink-soft); margin-bottom:10px; letter-spacing:1px;}
  .empty .en{font-size:11px; letter-spacing:3px; text-transform:uppercase; margin-bottom:16px;}

  /* 详情 */
  .detail-wrap{padding:0;}
  .dtop{padding:calc(env(safe-area-inset-top) + 40px) 28px 0;}
  .back{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-faint); cursor:pointer; display:inline-flex; align-items:center; gap:8px; margin-bottom:28px; background:none; border:none; padding:0;}
  .dtitle{font-size:22px; font-weight:400; line-height:1.55; color:var(--ink); letter-spacing:.2px;}
  .dconcepts{display:flex; gap:8px; margin-top:20px; flex-wrap:wrap;}
  .dconcepts .cc{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); border:0.5px solid var(--line); padding:5px 11px; display:inline-flex; align-items:center; gap:7px;}
  .dconcepts .cc .cn{font-family:'Noto Sans SC',sans-serif; letter-spacing:.5px; text-transform:none;}
  .dconcepts .cc .x{cursor:pointer; opacity:.6;}
  .dconcepts .addc{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-faint); border:0.5px dashed var(--line); padding:5px 11px; background:none; cursor:pointer;}

  .timeline{padding:36px 28px 20px;}
  .seg{padding-bottom:32px; position:relative;}
  .seg .ktag{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:11px; display:flex; align-items:center; gap:9px; cursor:pointer;}
  .seg .ktag .kcn{font-family:'Noto Sans SC',sans-serif; letter-spacing:1.5px;}
  .seg .ktag::before{content:''; width:16px; height:0.5px; background:var(--ink-faint); flex-shrink:0;}
  .seg.concl .ktag{color:var(--ink);}
  .seg.concl .ktag::before{background:var(--ink); width:24px;}
  .seg .sbody{font-size:15px; line-height:1.75; color:var(--ink); font-weight:300; letter-spacing:.1px; white-space:pre-wrap; word-break:break-word;}
  .seg.concl .sbody{font-weight:400; padding-left:16px; border-left:1.5px solid var(--ink);}
  .seg .source{margin-top:12px; font-size:12px; color:var(--ink-soft); letter-spacing:.2px; padding-left:16px; position:relative;}
  .seg .source::before{content:''; position:absolute; left:0; top:9px; width:8px; height:0.5px; background:var(--ink-faint);}
  .seg .source a{color:inherit;}
  .seg .when{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:1px; color:var(--ink-faint); margin-top:12px; display:flex; gap:14px; align-items:center;}
  .seg .sdel{cursor:pointer; text-transform:uppercase; letter-spacing:1.5px;}
  .kpick{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 4px 25px;}
  .kpick button{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; padding:5px 10px; border:0.5px solid var(--line); background:var(--card); color:var(--ink-soft); cursor:pointer;}
  .kpick button .kcn{font-family:'Noto Sans SC',sans-serif;}

  .addseg{margin:4px 28px 0; text-align:center; padding:16px; border:0.5px solid var(--line); font-family:'Inter',sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-soft); cursor:pointer; transition:.15s;}
  .addseg:hover{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  /* 脉络 */
  .glx-head{padding:6px 28px 0; font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--ink-faint);}
  #galaxyWrap{margin:14px 28px 0; border:0.5px solid var(--line); overflow:hidden; touch-action:none;}
  #galaxy{display:block; width:100%; height:58vh; max-height:480px;}
  .glxhint{font-size:11px; color:var(--ink-faint); text-align:center; margin:12px 28px 0; min-height:16px; letter-spacing:.5px;}
  .glxhint b{color:var(--ink-soft); font-weight:400;}

  .fab{position:fixed; left:0; right:0; bottom:0; max-width:600px; margin:0 auto; background:var(--ink); color:var(--paper); font-family:'Noto Sans SC',sans-serif; font-size:15px; font-weight:400; letter-spacing:3px; padding:20px 20px calc(env(safe-area-inset-bottom) + 20px); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:30; border:none; width:100%;}
  .fab .cn{font-family:'Noto Sans SC',sans-serif; letter-spacing:3px; line-height:1;}

  /* 顶部视图切换 */
  .view-tabs{display:flex; align-items:stretch; padding:6px 28px 0;}
  .vtab{flex:1; text-align:center; background:none; border:none; padding:0 0 8px; font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-faint); cursor:pointer; border-bottom:1px solid transparent; white-space:nowrap; position:relative;}
  .vtab.on{color:var(--ink); border-bottom-color:var(--ink);}
  .sorttri{display:none; width:0; height:0; margin-left:7px; vertical-align:middle; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--ink-faint); transition:transform .18s;}
  .vtab.on .sorttri{display:inline-block;}
  .sorttri.up{transform:rotate(180deg);}

  /* 浮层 */
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; opacity:0; pointer-events:none; transition:.2s;}
  .sheet-bg.show{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:50; max-width:600px; margin:0 auto; background:var(--paper); padding:28px 28px calc(env(safe-area-inset-bottom) + 24px); transform:translateY(100%); transition:transform .28s cubic-bezier(.3,.9,.3,1); max-height:90vh; overflow-y:auto; border-top:0.5px solid var(--line);}
  .sheet.show{transform:none;}
  .sheet .sh-title{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:20px;}
  .sheet label{display:block; font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-faint); margin:0 0 8px;}
  .field{width:100%; font-family:inherit; font-size:15px; color:var(--ink); background:transparent; border:none; border-bottom:0.5px solid var(--line-strong,var(--line)); border-bottom-color:var(--line); padding:8px 0; margin-bottom:22px; resize:none; letter-spacing:.2px;}
  .field::placeholder{color:var(--ink-faint);}
  .field:focus{outline:none; border-bottom-color:var(--ink);}
  textarea.field{min-height:80px; line-height:1.6;}
  .field.err{border-bottom-color:#C0563A;}

  #sourceFields{border:0.5px solid var(--line); padding:16px 16px 4px; margin-bottom:22px; transition:opacity .2s;}
  #sourceFields.dim{opacity:.4;}
  #sourceFields .field:disabled{cursor:not-allowed;}
  #sourceFields label{margin-bottom:10px;}

  .ktabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
  .ktab{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; padding:8px 12px; border:0.5px solid var(--line); color:var(--ink-soft); background:none; cursor:pointer;}
  .ktab .kcn{font-family:'Noto Sans SC',sans-serif; letter-spacing:1px;}
  .ktab.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
  .chip{font-size:12px; letter-spacing:.5px; padding:7px 13px; border:0.5px solid var(--line); color:var(--ink-soft); background:none; cursor:pointer; font-family:inherit;}
  .chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .sheet-foot{display:flex; gap:0; margin-top:8px; border:0.5px solid var(--ink);}
  .btn{flex:1; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; padding:15px; cursor:pointer; border:none; background:var(--paper); color:var(--ink);}
  .btn.primary{background:var(--ink); color:var(--paper);}
  .btn .cn{font-family:'Noto Sans SC',sans-serif; letter-spacing:1.5px;}
  .btn+.btn{border-left:0.5px solid var(--ink);}

  .panel{position:fixed; inset:0; z-index:60; background:var(--paper); padding:calc(env(safe-area-inset-top) + 40px) 28px calc(env(safe-area-inset-bottom) + 24px); max-width:600px; margin:0 auto; overflow-y:auto; transform:translateX(100%); transition:transform .25s ease;}
  .panel.show{transform:none;}
  .panel .p-head{display:flex; align-items:center; gap:14px; margin-bottom:28px;}
  .panel .p-head button{background:none;border:none;color:var(--ink);font-size:18px;cursor:pointer;padding:0; font-family:'Inter',sans-serif;}
  .panel h2{font-family:'Inter',sans-serif; font-weight:400; font-size:11px; letter-spacing:3px; text-transform:uppercase; margin:0; color:var(--ink-faint);}
  .p-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 0; border-bottom:0.5px solid var(--line-soft);}
  .p-row .l{font-size:14px; letter-spacing:.3px;}
  .p-row .d{font-size:11px; color:var(--ink-faint); margin-top:3px; letter-spacing:.2px;}
  .p-row button{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; padding:8px 14px; cursor:pointer; border:0.5px solid var(--line); background:none; color:var(--ink);}
  .p-row button.warn{color:#C0563A; border-color:rgba(192,86,58,.4);}
  .p-note{font-size:12px; color:var(--ink-faint); line-height:1.9; margin-top:24px; letter-spacing:.3px;}
  .p-note b{color:var(--ink-soft); font-weight:400;}

  .toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; padding:12px 22px; z-index:80; opacity:0; pointer-events:none; transition:.25s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brow"><h1>问渠</h1><span class="ben">Wellspring</span></div>
    </div>
    <button class="gear" id="gearBtn" aria-label="settings"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/></svg></button>
  </header>

  <main>
    <div class="installbar" id="installBar">添加到主屏幕<button id="installBtn">Install</button></div>

    <div class="view-tabs">
      <button class="vtab on" data-view="list">Threads · 线索<span class="sorttri" id="sortTri" title="最新"></span></button>
      <button class="vtab" data-view="galaxy">Constellation · 脉络</button>
    </div>
    <div id="listView">
      <div style="height:14px;"></div>
      <div id="threadList"></div>
    </div>

    <div id="detailView" style="display:none;"></div>

    <div id="galaxyView" style="display:none;">
      <div id="galaxyWrap"><svg id="galaxy" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="glxhint" id="glxhint">拖动节点换位置,点一下看这个概念下有哪些线索</div>
    </div>
  </main>
</div>

<button class="fab" id="fab" style="display:none;"><span class="cn" id="fabText">起一条线索</span></button>

<div class="sheet-bg" id="sheetBg"></div>

<div class="sheet" id="threadSheet">
  <div class="sh-title">New Thread · 起一条线索</div>
  <label>Inquiry · 你在琢磨什么问题</label>
  <input class="field" id="tTitle" type="text" placeholder="把它写成一个问题" />
  <label>Concepts · 挂上概念(可多选)</label>
  <div class="chips" id="tConceptChips"></div>
  <input class="field" id="tNewConcept" type="text" placeholder="输入新概念名,回车添加" />
  <div class="sheet-foot">
    <button class="btn" id="tCancel">Cancel</button>
    <button class="btn primary" id="tSave">Create</button>
  </div>
</div>

<div class="sheet" id="segSheet">
  <div class="sh-title">Add Entry · 续一段</div>
  <label>Type · 类型</label>
  <div class="ktabs" id="kTabs"></div>
  <label>Content · 内容</label>
  <textarea class="field" id="sBody" placeholder="这一步的想法、材料或结论"></textarea>
  <div id="sourceFields">
    <label id="sourceHint">Source · 来源(选“引申”时可填)</label>
    <input class="field" id="sSource" type="text" placeholder="书名、人名、出处均可" />
    <input class="field" id="sLink" type="text" placeholder="链接(可选)" style="margin-bottom:16px;" />
  </div>
  <div class="sheet-foot">
    <button class="btn" id="sCancel">Cancel</button>
    <button class="btn primary" id="sSave">Add</button>
  </div>
</div>

<div class="sheet" id="conceptSheet">
  <div class="sh-title">Concepts · 挂概念</div>
  <div class="chips" id="attachChips"></div>
  <input class="field" id="attachNew" type="text" placeholder="输入新概念名,回车添加" />
  <div class="sheet-foot"><button class="btn primary" id="attachDone">Done</button></div>
</div>

<div class="panel" id="panel">
  <div class="p-head"><button id="panelBack">← Back</button><h2>Settings · 设置</h2></div>
  <div class="p-row"><div><div class="l">导出备份</div><div class="d">存成文件,换设备也不丢</div></div><button id="exportBtn">Export</button></div>
  <div class="p-row"><div><div class="l">导入</div><div class="d">从备份恢复,覆盖现有内容</div></div><button id="importBtn">Import</button><input type="file" id="importFile" accept="application/json" style="display:none" /></div>
  <div class="p-row"><div><div class="l">清空重来</div><div class="d">删掉全部线索</div></div><button class="warn" id="clearBtn">Clear</button></div>
  <div class="p-note"><b>问渠 · Wellspring</b><br>记录一个想法从冒头到结论的过程:提问、引申、迭代、初步结论,日后有新讨论还能继续更新。一条线索可挂多个概念,概念之间便连成脉络。<br><br>问渠那得清如许,为有源头活水来。<br><br><b>数据全部存在这台设备上</b>,不上传服务器。记得偶尔导出备份。<br><br><span style="font-family:Inter,sans-serif;letter-spacing:2px;text-transform:uppercase;font-size:10px;">Version 1.4.7</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const KEY='wenqu-threads-v1';
  const cssv=(v)=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const KINDS=[
    {k:'ask', cn:'提问', en:'Inquiry'},
    {k:'source', cn:'引申', en:'Source'},
    {k:'iterate', cn:'迭代', en:'Iteration'},
    {k:'conclude', cn:'初步结论', en:'Conclusion'},
    {k:'update', cn:'更新', en:'Update'}
  ];
  const kInfo=(k)=>KINDS.find(x=>x.k===k)||KINDS[0];

  const SEED={
    concepts:[{id:'c_soc',label:'社会学',x:150,y:150},{id:'c_net',label:'网络',x:250,y:180},{id:'c_topo',label:'拓扑',x:180,y:260}],
    threads:[
      {id:'t1',title:'为什么找工作时,不熟的人反而更有用?',conceptIds:['c_soc','c_net'],createdAt:Date.now()-86400000*10},
      {id:'t2',title:'咖啡杯和甜甜圈,为什么拓扑上是一样的?',conceptIds:['c_topo','c_net'],createdAt:Date.now()-86400000*4}
    ],
    entries:[
      {id:'e1',threadId:'t1',kind:'ask',body:'直觉上该找关系好的人帮忙,但现实里常常是泛泛之交带来了机会。为什么?',link:'',source:'',createdAt:Date.now()-86400000*10},
      {id:'e2',threadId:'t1',kind:'source',body:'强连接的圈子信息高度重叠,而弱连接架起不同社群,带来非冗余的新信息。',link:'',source:'Granovetter,《The Strength of Weak Ties》1973',createdAt:Date.now()-86400000*9},
      {id:'e3',threadId:'t1',kind:'iterate',body:'那是不是所有场景弱连接都更好?似乎不对——需要情感支持、深度信任时,还是强连接靠谱。得分场景。',link:'',source:'',createdAt:Date.now()-86400000*7},
      {id:'e4',threadId:'t1',kind:'conclude',body:'弱连接的优势在信息广度,强连接的优势在深度与信任。该找谁,取决于你要的是新机会,还是支持。',link:'',source:'',createdAt:Date.now()-86400000*7},
      {id:'e5',threadId:'t1',kind:'update',body:'两周后与友人谈及,他补充:弱连接亦有代价——信息浅、不牢靠。或许"广度换深度"本身就是取舍。',link:'',source:'',createdAt:Date.now()-86400000*1},
      {id:'e6',threadId:'t2',kind:'ask',body:'常听说"拓扑学家分不清咖啡杯和甜甜圈",这到底什么意思?',link:'',source:'',createdAt:Date.now()-86400000*4},
      {id:'e7',threadId:'t2',kind:'conclude',body:'拓扑只关心连接方式,不关心形状大小。两者都只有一个洞,能连续形变成对方,所以拓扑等价。',link:'',source:'',createdAt:Date.now()-86400000*3}
    ]
  };

  let state=load(); let sortMode='new';
  function load(){ try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return JSON.parse(JSON.stringify(SEED)); }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  const $=(s)=>document.querySelector(s);
  const concept=(id)=>state.concepts.find(c=>c.id===id);
  const thread=(id)=>state.threads.find(t=>t.id===id);
  const entriesOf=(tid)=>state.entries.filter(e=>e.threadId===tid).sort((a,b)=>a.createdAt-b.createdAt);
  const esc=(s)=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const lastEntry=(tid)=>{ const es=entriesOf(tid); return es[es.length-1]; };
  const activeTime=(t)=>{ const l=lastEntry(t.id); return l?l.createdAt:t.createdAt; };

  let view='list', currentThread=null, editingKind=null;

  function pad(n){ return (n<10?'0':'')+n; }
  function fmtEn(t){ const d=new Date(t), now=new Date(); const days=Math.floor((now-d)/86400000);
    if(days<=0) return 'today'; if(days===1) return '1 day ago'; if(days<30) return days+' days ago';
    return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear(); }
  function stageOf(t){ const l=lastEntry(t.id); return l?kInfo(l.kind).cn:'空'; }

  document.querySelectorAll('.vtab').forEach(t=>{ t.addEventListener('click',()=>{
    document.querySelectorAll('.vtab').forEach(x=>x.classList.remove('on')); t.classList.add('on'); switchView(t.dataset.view); }); });
  function switchView(v){
    view=v; currentThread=null;
    $('#listView').style.display=v==='list'?'block':'none';
    $('#detailView').style.display='none';
    $('#galaxyView').style.display=v==='galaxy'?'block':'none';
    document.querySelector('.view-tabs').style.display='flex';
    
    $('#fab').style.display=v==='list'?'block':'none';
    $('#fabText').textContent='起一条线索';
    if(v==='galaxy'){ startGalaxy(); } else { stopGalaxy(); }
    if(v==='list') renderList();
  }

  $('#sortTri').addEventListener('click',(e)=>{ e.stopPropagation();
    sortMode = sortMode==='new'?'old':'new';
    const tri=$('#sortTri'); tri.classList.toggle('up', sortMode==='old');
    tri.title = sortMode==='new'?'最新':'最早';
    renderList(); });

  function renderList(){
    const el=$('#threadList'); el.innerHTML='';
    if(state.threads.length===0){
      el.innerHTML='<div class="empty"><div class="en">No threads yet</div><div class="big">渠里还没有水</div>点下面起你的第一条线索</div>'; return;
    }
    const sorted=state.threads.slice().sort((a,b)=> sortMode==='new' ? activeTime(b)-activeTime(a) : activeTime(a)-activeTime(b));
    sorted.forEach((t,i)=>{
      const cs=t.conceptIds.map(id=>{const c=concept(id);return c?c.label:'';}).filter(Boolean).join(', ');
      const card=document.createElement('div'); card.className='thread';
      card.innerHTML='<div class="num">'+pad(i+1)+'</div><div class="col"><div class="ttitle">'+esc(t.title)+'</div>'+
        '<div class="tmeta">'+(cs?'<span class="tconcepts">'+esc(cs)+'</span>':'')+'<span class="tstage">'+esc(stageOf(t))+'</span></div></div>';
      card.addEventListener('click',()=>openThread(t.id)); el.appendChild(card);
    });
  }

  function openThread(id){
    currentThread=id; view='detail'; editingKind=null;
    $('#listView').style.display='none'; $('#galaxyView').style.display='none'; $('#detailView').style.display='block';
    document.querySelector('.view-tabs').style.display='none'; $('#fab').style.display='none'; stopGalaxy(); renderDetail();
    window.scrollTo(0,0);
  }
  function renderDetail(){
    const t=thread(currentThread); if(!t){ switchView('list'); return; }
    let concepts=t.conceptIds.map(id=>{const c=concept(id); return c?'<span class="cc"><span class="cn">'+esc(c.label)+'</span><span class="x" data-cid="'+id+'">✕</span></span>':'';}).join('');
    let segs='';
    entriesOf(t.id).forEach(e=>{ const ki=kInfo(e.kind); const concl=e.kind==='conclude'?' concl':'';
      segs+='<div class="seg'+concl+'">';
      segs+='<div class="ktag" data-eid="'+e.id+'"><span class="kcn">'+ki.cn+'</span> '+ki.en+'</div>';
      if(editingKind===e.id){ segs+='<div class="kpick">'; KINDS.forEach(k=>{ segs+='<button data-eid="'+e.id+'" data-k="'+k.k+'"><span class="kcn">'+k.cn+'</span></button>'; }); segs+='</div>'; }
      segs+='<div class="sbody">'+esc(e.body)+'</div>';
      if(e.kind==='source' && (e.source||e.link)){ segs+='<div class="source">'; if(e.link){ segs+='<a href="'+esc(e.link)+'" target="_blank" rel="noopener">'+esc(e.source||e.link)+'</a>'; } else { segs+=esc(e.source); } segs+='</div>'; }
      segs+='<div class="when">'+fmtEn(e.createdAt)+'<span class="sdel" data-del="'+e.id+'">delete</span></div>';
      segs+='</div>';
    });
    $('#detailView').innerHTML=
      '<div class="dtop"><button class="back" id="dBack">← Threads</button><div class="dtitle">'+esc(t.title)+'</div>'+
      '<div class="dconcepts">'+concepts+'<button class="addc" id="dAddConcept">+ Concept</button></div></div>'+
      '<div class="timeline">'+segs+'</div>'+
      '<div class="addseg" id="dAddSeg">＋ Add Entry · 续一段</div><div style="height:100px"></div>';
    $('#dBack').addEventListener('click',()=>switchView('list'));
    $('#dAddSeg').addEventListener('click',openSeg);
    $('#dAddConcept').addEventListener('click',openConceptSheet);
    document.querySelectorAll('#detailView .cc .x').forEach(x=>x.addEventListener('click',()=>detachConcept(x.getAttribute('data-cid'))));
    document.querySelectorAll('#detailView .ktag').forEach(l=>l.addEventListener('click',()=>{ editingKind=editingKind===l.getAttribute('data-eid')?null:l.getAttribute('data-eid'); renderDetail(); }));
    document.querySelectorAll('#detailView .kpick button').forEach(b=>b.addEventListener('click',()=>changeKind(b.getAttribute('data-eid'),b.getAttribute('data-k'))));
    document.querySelectorAll('#detailView .sdel').forEach(d=>d.addEventListener('click',()=>{ if(confirm('删除这一段?')) delEntry(d.getAttribute('data-del')); }));
  }
  function changeKind(eid,k){ const e=state.entries.find(x=>x.id===eid); if(e){ e.kind=k; editingKind=null; save(); renderDetail(); } }
  function delEntry(eid){ state.entries=state.entries.filter(x=>x.id!==eid); save(); renderDetail(); }
  function detachConcept(cid){ const t=thread(currentThread); t.conceptIds=t.conceptIds.filter(x=>x!==cid); save(); renderDetail(); }

  const sheetBg=$('#sheetBg');
  let tSelConcepts=[];
  function showSheet(id){ sheetBg.classList.add('show'); $(id).classList.add('show'); }
  function hideSheets(){ sheetBg.classList.remove('show'); document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show')); }
  sheetBg.addEventListener('click',hideSheets);

  function openThreadSheet(){ tSelConcepts=[]; $('#tTitle').value=''; $('#tNewConcept').value=''; $('#tTitle').classList.remove('err'); renderTConceptChips(); showSheet('#threadSheet'); setTimeout(()=>$('#tTitle').focus(),280); }
  function renderTConceptChips(){ const box=$('#tConceptChips'); box.innerHTML=''; state.concepts.forEach(c=>{ const chip=document.createElement('button'); chip.className='chip'+(tSelConcepts.includes(c.id)?' on':''); chip.textContent=c.label; chip.addEventListener('click',()=>{ tSelConcepts=tSelConcepts.includes(c.id)?tSelConcepts.filter(x=>x!==c.id):tSelConcepts.concat(c.id); renderTConceptChips(); }); box.appendChild(chip); }); }
  $('#tNewConcept').addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); const v=e.target.value.trim(); if(!v)return; const id=newConcept(v); tSelConcepts.push(id); e.target.value=''; renderTConceptChips(); } });
  function newConcept(label){ const id='c_'+Date.now()+'_'+Math.floor(Math.random()*999); state.concepts.push({id,label,x:200+(Math.random()-.5)*120,y:200+(Math.random()-.5)*120}); return id; }
  $('#fab').addEventListener('click',openThreadSheet);
  $('#tCancel').addEventListener('click',hideSheets);
  $('#tTitle').addEventListener('input',()=>$('#tTitle').classList.remove('err'));
  $('#tSave').addEventListener('click',()=>{ const title=$('#tTitle').value.trim(); if(!title){ $('#tTitle').classList.add('err'); $('#tTitle').focus(); return; } const id='t_'+Date.now(); state.threads.push({id,title,conceptIds:tSelConcepts.slice(),createdAt:Date.now()}); save(); hideSheets(); toast('线索起好了'); openThread(id); });

  let segKind='iterate';
  function openSeg(){ segKind='iterate'; $('#sBody').value=''; $('#sSource').value=''; $('#sLink').value=''; $('#sBody').classList.remove('err'); renderKTabs(); updateSourceState(); showSheet('#segSheet'); setTimeout(()=>$('#sBody').focus(),280); }
  function updateSourceState(){ const on=segKind==='source'; $('#sourceFields').classList.toggle('dim',!on); $('#sSource').disabled=!on; $('#sLink').disabled=!on; $('#sourceHint').innerHTML=on?'Source · 来源':'Source · 来源(选“引申”时可填)'; }
  function renderKTabs(){ const box=$('#kTabs'); box.innerHTML=''; KINDS.forEach(k=>{ const b=document.createElement('button'); b.className='ktab'+(segKind===k.k?' on':''); b.innerHTML='<span class="kcn">'+k.cn+'</span>'; b.addEventListener('click',()=>{ segKind=k.k; updateSourceState(); renderKTabs(); }); box.appendChild(b); }); }
  $('#sCancel').addEventListener('click',hideSheets);
  $('#sBody').addEventListener('input',()=>$('#sBody').classList.remove('err'));
  $('#sSave').addEventListener('click',()=>{ const body=$('#sBody').value.trim(); if(!body){ $('#sBody').classList.add('err'); $('#sBody').focus(); return; } state.entries.push({id:'e_'+Date.now(),threadId:currentThread,kind:segKind,body,link:segKind==='source'?$('#sLink').value.trim():'',source:segKind==='source'?$('#sSource').value.trim():'',createdAt:Date.now()}); save(); hideSheets(); renderDetail(); toast('已续一段'); });

  function openConceptSheet(){ renderAttachChips(); $('#attachNew').value=''; showSheet('#conceptSheet'); }
  function renderAttachChips(){ const t=thread(currentThread); const box=$('#attachChips'); box.innerHTML=''; state.concepts.forEach(c=>{ const on=t.conceptIds.includes(c.id); const chip=document.createElement('button'); chip.className='chip'+(on?' on':''); chip.textContent=c.label; chip.addEventListener('click',()=>{ if(on){ t.conceptIds=t.conceptIds.filter(x=>x!==c.id); } else { t.conceptIds.push(c.id); } save(); renderAttachChips(); }); box.appendChild(chip); }); }
  $('#attachNew').addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); const v=e.target.value.trim(); if(!v)return; const id=newConcept(v); thread(currentThread).conceptIds.push(id); e.target.value=''; save(); renderAttachChips(); } });
  $('#attachDone').addEventListener('click',()=>{ hideSheets(); renderDetail(); });

  const svg=$('#galaxy'); let raf=null, selected=null, dragId=null, alpha=0; const vel={};
  function computeLinks(){ const set=new Set(),links=[]; state.threads.forEach(t=>{const cs=t.conceptIds; for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){const key=[cs[i],cs[j]].sort().join('|'); if(!set.has(key)){set.add(key);links.push([cs[i],cs[j]]);}}}); return links; }
  function threadCount(cid){ return state.threads.filter(t=>t.conceptIds.includes(cid)).length; }
  function startGalaxy(){ state.concepts.forEach(c=>{ if(c.x===undefined)c.x=200+(Math.random()-.5)*120; if(c.y===undefined)c.y=200+(Math.random()-.5)*120; vel[c.id]=vel[c.id]||{vx:0,vy:0}; }); alpha=1; if(!raf) tick(); renderGalaxy(); }
  function stopGalaxy(){ if(raf){ cancelAnimationFrame(raf); raf=null; } }
  function tick(){ const N=state.concepts, links=computeLinks();
    if(alpha>0.005){
      for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){ const a=N[i],b=N[j]; let dx=a.x-b.x,dy=a.y-b.y; let d2=dx*dx+dy*dy; if(d2<0.01)d2=0.01; const d=Math.sqrt(d2),f=1400/d2,fx=(dx/d)*f,fy=(dy/d)*f; vel[a.id].vx+=fx;vel[a.id].vy+=fy;vel[b.id].vx-=fx;vel[b.id].vy-=fy; }
      links.forEach(l=>{ const a=concept(l[0]),b=concept(l[1]); if(!a||!b)return; let dx=b.x-a.x,dy=b.y-a.y; const d=Math.sqrt(dx*dx+dy*dy)||0.01,f=(d-90)*0.02,fx=(dx/d)*f,fy=(dy/d)*f; vel[a.id].vx+=fx;vel[a.id].vy+=fy;vel[b.id].vx-=fx;vel[b.id].vy-=fy; });
      N.forEach(c=>{ vel[c.id].vx+=(200-c.x)*0.005; vel[c.id].vy+=(200-c.y)*0.005; });
      N.forEach(c=>{ if(c.id===dragId)return; vel[c.id].vx*=0.82; vel[c.id].vy*=0.82; c.x+=vel[c.id].vx*alpha; c.y+=vel[c.id].vy*alpha; c.x=Math.max(28,Math.min(372,c.x)); c.y=Math.max(28,Math.min(372,c.y)); });
      alpha*=0.985; renderGalaxy();
    }
    raf=requestAnimationFrame(tick);
  }
  function renderGalaxy(){ const links=computeLinks(); let s=''; const ink=cssv('--ink'), faint=cssv('--ink-faint'), line=cssv('--line');
    links.forEach(l=>{ const a=concept(l[0]),b=concept(l[1]); if(!a||!b)return; s+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+faint+'" stroke-width="0.5"/>'; });
    state.concepts.forEach(c=>{ const cnt=threadCount(c.id); const r=5+cnt*2.5; const sel=selected===c.id;
      s+='<g class="gnode" data-id="'+c.id+'" style="cursor:grab;">';
      if(sel) s+='<circle cx="'+c.x+'" cy="'+c.y+'" r="'+(r+7)+'" fill="none" stroke="'+ink+'" stroke-width="0.5"/>';
      s+='<circle cx="'+c.x+'" cy="'+c.y+'" r="'+r+'" fill="'+(sel?ink:faint)+'"/>';
      s+='<text x="'+c.x+'" y="'+(c.y+r+15)+'" text-anchor="middle" font-size="11" font-family="Noto Sans SC,sans-serif" letter-spacing="1" fill="'+(sel?ink:cssv('--ink-soft'))+'">'+esc(c.label)+'</text>';
      s+='</g>'; });
    svg.innerHTML=s;
    svg.querySelectorAll('.gnode').forEach(g=>{ g.addEventListener('pointerdown',(e)=>onDown(e,g.getAttribute('data-id'))); });
  }
  function svgPoint(e){ const r=svg.getBoundingClientRect(); return {x:((e.clientX-r.left)/r.width)*400,y:((e.clientY-r.top)/r.height)*400}; }
  let moved=false, downPt=null;
  function onDown(e,id){ e.preventDefault(); dragId=id; moved=false; downPt=svgPoint(e); alpha=Math.max(alpha,0.6); svg.setPointerCapture(e.pointerId); svg.addEventListener('pointermove',onMove); svg.addEventListener('pointerup',onUp); svg.addEventListener('pointercancel',onUp); }
  function onMove(e){ if(!dragId)return; const p=svgPoint(e),c=concept(dragId); if(!c)return; if(Math.abs(p.x-downPt.x)+Math.abs(p.y-downPt.y)>4)moved=true; c.x=Math.max(28,Math.min(372,p.x)); c.y=Math.max(28,Math.min(372,p.y)); vel[dragId]={vx:0,vy:0}; renderGalaxy(); }
  function onUp(){ const id=dragId; dragId=null; svg.removeEventListener('pointermove',onMove); svg.removeEventListener('pointerup',onUp); svg.removeEventListener('pointercancel',onUp); if(!moved&&id){ selectNode(id); } else { save(); } alpha=Math.max(alpha,0.3); }
  function selectNode(id){ selected=selected===id?null:id; const c=concept(id); const cnt=threadCount(id); const hint=$('#glxhint');
    if(selected){ const ts=state.threads.filter(t=>t.conceptIds.includes(id)); const titles=ts.slice(0,2).map(t=>t.title).join(' / '); hint.innerHTML='<b>'+esc(c.label)+'</b> · '+cnt+' 条线索'+(titles?' · '+esc(titles)+(ts.length>2?'…':''):''); }
    else { hint.textContent='拖动节点换位置,点一下看这个概念下有哪些线索'; } renderGalaxy(); }

  $('#gearBtn').addEventListener('click',()=>$('#panel').classList.add('show'));
  $('#panelBack').addEventListener('click',()=>$('#panel').classList.remove('show'));
  $('#exportBtn').addEventListener('click',()=>{ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); const d=new Date(); a.href=url; a.download='wenqu-backup-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'.json'; a.click(); URL.revokeObjectURL(url); toast('已导出'); });
  $('#importBtn').addEventListener('click',()=>$('#importFile').click());
  $('#importFile').addEventListener('change',(e)=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.threads||!d.entries){ toast('格式不对'); return; } state=d; save(); switchView('list'); $('#panel').classList.remove('show'); toast('已恢复'); }catch(err){ toast('读取失败'); } }; rd.readAsText(f); e.target.value=''; });
  $('#clearBtn').addEventListener('click',()=>{ if(confirm('确定清空全部?建议先导出备份。')){ state={concepts:[],threads:[],entries:[]}; save(); switchView('list'); $('#panel').classList.remove('show'); toast('已清空'); } });

  let toastTimer=null;
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600); }

  if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{})); }
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); deferredPrompt=e; $('#installBar').classList.add('show'); });
  $('#installBtn').addEventListener('click',async()=>{ if(!deferredPrompt)return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $('#installBar').classList.remove('show'); });
  window.addEventListener('appinstalled',()=>$('#installBar').classList.remove('show'));

  $('#fab').style.display='block';
  renderList();
})();
</script>
</body>
</html>
